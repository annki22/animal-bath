<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>动物泡澡 · 手搓版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    background: #F5F4F0;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  .game {
    width: 100%; max-width: 420px; height: 100vh; height: 100dvh; max-height: 860px;
    background: linear-gradient(180deg, #EAF3F5 0%, #F7F4EC 40%, #F5F4F0 100%);
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }

  /* ===== 顶部 ===== */
  .topbar {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 14px 16px 4px;
  }
  .title { font-size: 20px; font-weight: 800; letter-spacing: 1px; color: #2F3542; }
  .title small { display: block; font-size: 11px; font-weight: 500; color: #9AA0A8; letter-spacing: 2px; margin-top: 2px; }
  .scorebox { text-align: right; }
  .score-label { font-size: 10px; color: #9AA0A8; letter-spacing: 1px; }
  .score { font-size: 26px; font-weight: 800; color: #2F3542; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .best { font-size: 11px; color: #B8BEC6; margin-top: 2px; }

  /* ===== 预览区（当前动物 + 下一个） ===== */
  .next-row {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 8px 16px 6px;
  }
  .next-label { font-size: 11px; color: #9AA0A8; letter-spacing: 1px; margin-right: 2px; }
  .next-slot {
    width: 52px; height: 52px; border-radius: 14px;
    background: rgba(255,255,255,0.75);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .next-slot.current { background: #FFF6DE; box-shadow: inset 0 0 0 2px #FFD75E; }
  /* 预览区方块：独立正方形尺寸，不受棋盘 --tile 影响 */
  .next-slot .tile {
    width: calc(var(--tile, 40px) * .62);
    height: calc(var(--tile, 40px) * .62);
    font-size: calc(var(--tile-font, 21px) * .78);
    border-radius: calc(var(--tile, 40px) * .18);
    animation: popIn .25s ease;
  }
  @keyframes popIn { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .cur-tag {
    position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    font-size: 9px; font-weight: 700; color: #B8860B; letter-spacing: 1px;
  }

  /* ===== 棋盘 ===== */
  .board-wrap { flex: 1; padding: 6px 12px 10px; position: relative; }
  /* 棋盘（泡泡浴缸底） */
  .board {
    position: relative; height: 100%;
    background:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,.55) 0 5px, transparent 6.5px),
      radial-gradient(circle at 78% 10%, rgba(255,255,255,.45) 0 4px, transparent 5.5px),
      radial-gradient(circle at 55% 26%, rgba(255,255,255,.35) 0 3px, transparent 4px),
      radial-gradient(circle at 30% 68%, rgba(255,255,255,.4) 0 4px, transparent 5.5px),
      radial-gradient(circle at 88% 62%, rgba(255,255,255,.3) 0 3px, transparent 4px),
      linear-gradient(180deg, #E8F6FA 0%, #D6ECF1 100%);
    border-radius: 24px;
    border: 3px solid #CBE4EA;
    overflow: hidden;
  }
  .cols-bg {
    position: absolute; inset: 0;
    display: grid; grid-template-columns: repeat(5, 1fr);
    padding: 4px;
  }
  .col-bg {
    background: rgba(212,236,242,0.6);
    border-radius: 6px;
    margin: 1px;
  }
  .col-bg:nth-child(odd) { background: rgba(190,226,235,0.65); }
  /* 警戒线 */
  .danger-line {
    position: absolute; left: 10px; right: 10px; top: 62px;
    border-top: 3px dashed #FF7B93;
    opacity: .55; pointer-events: none;
  }
  .danger-tag {
    position: absolute; right: 8px; top: 50px;
    font-size: 9px; color: #FF7B93; letter-spacing: 1px; font-weight: 600;
    pointer-events: none;
  }

  /* 棋子 */
  .tile {
    width: var(--tile, 40px); height: var(--tile, 40px);
    border-radius: calc(var(--tile, 40px) * .24);
    position: relative;
    display: flex; align-items: center; justify-content: center;
    font-size: var(--tile-font, 21px);
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,.5),
      inset 0 -4px 0 rgba(0,0,0,.10),
      0 2px 5px rgba(60,110,125,.20);
    cursor: pointer;
    transition: transform .15s;
  }
  /* 左上高光，增加立体感 */
  .tile::before {
    content: '';
    position: absolute; top: 9%; left: 12%;
    width: 30%; height: 20%;
    border-radius: 50%;
    background: rgba(255,255,255,.5);
    pointer-events: none;
  }
  .tile .num {
    position: absolute; bottom: 4%; left: 50%; transform: translateX(-50%);
    color: #fff;
    font-size: calc(var(--tile, 40px) * .32); font-weight: 900;
    line-height: 1; letter-spacing: 0;
    text-shadow:
      0 1px 1px rgba(0,0,0,.45),
      0 0 2px rgba(0,0,0,.65),
      0 0 6px rgba(0,0,0,.35);
    pointer-events: none;
  }
  .tile.highlight { animation: mergeFlash .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes mergeFlash {
    0% { transform: scale(1.5) translateY(-4px); filter: brightness(1.6); }
    60% { transform: scale(.94) translateY(1px); filter: brightness(1.15); }
    100% { transform: scale(1) translateY(0); filter: brightness(1); }
  }
  .tile.fall { animation: fallIn .24s cubic-bezier(.22,.9,.3,1); }
  @keyframes fallIn {
    0% { transform: translateY(-150px) scale(.9); opacity: .4; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  .tile.shake { animation: shake .3s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  .tile.merge-pop { animation: mergePop .45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes mergePop {
    0% { transform: scale(.3); opacity: .4; }
    100% { transform: scale(1); opacity: 1; }
  }
  /* 合成预备：两个方块碰撞闪烁 */
  .tile.merge-flash {
    animation: mergeFlash .26s ease;
    z-index: 30;
  }
  @keyframes mergeFlash {
    0% { transform: scale(1); filter: brightness(1); }
    40% { transform: scale(1.22) translateY(-3px); filter: brightness(1.7); }
    100% { transform: scale(1); filter: brightness(1); }
  }
  /* 合成消失：参与合成的旧方块缩小淡出 */
  .tile.merge-gone {
    animation: mergeGone .24s ease forwards;
    z-index: 30;
  }
  @keyframes mergeGone {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(.15); opacity: 0; }
  }

  /* 列（点击层） */
  .cols {
    position: absolute; inset: 0;
    display: grid; grid-template-columns: repeat(5, 1fr);
    z-index: 5;
  }
  .col {
    position: relative;
    display: flex; flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: background .12s;
    border-radius: 24px;
  }
  .col:active { background: rgba(255,255,255,0.3); }
  /* 棋子堆：从底部往上堆，栈顶在最上 */
  .col .stack {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 8px;
    display: flex; flex-direction: column-reverse;
    align-items: center; gap: var(--gap, 3px);
    pointer-events: none;
  }
  .col .stack .tile { pointer-events: auto; }
  .col .arrow {
    position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    width: 30px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    color: #7FB6C4; font-size: 14px; font-weight: 700;
    opacity: .7; pointer-events: none;
  }

  /* ===== 底部 ===== */
  .bottombar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px 14px;
  }
  .hint { font-size: 11px; color: #9AA0A8; line-height: 1.5; }
  .hint b { color: #7FB6C4; }
  .combo { font-size: 13px; font-weight: 700; color: #FF7B93; min-height: 18px; letter-spacing: 1px; }
  .btn {
    border: none; cursor: pointer;
    font-size: 13px; font-weight: 700; letter-spacing: 1px;
    padding: 10px 18px; border-radius: 14px;
    background: #2F3542; color: #fff;
    transition: transform .12s, opacity .2s;
  }
  .btn:active { transform: scale(.94); }
  .btn.restart { background: #E8E6E0; color: #6B7280; }

  /* ===== 特效层 ===== */
  .fx-layer { position: absolute; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
  .float-text {
    position: absolute; font-weight: 800; color: #FF7B93;
    font-size: 15px; animation: floatUp 1s ease forwards;
    text-shadow: 0 1px 0 rgba(255,255,255,.8);
    white-space: nowrap;
  }
  @keyframes floatUp {
    0% { transform: translateY(0); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(-70px); opacity: 0; }
  }
  .particle {
    position: absolute; border-radius: 50%;
    animation: burst .7s ease-out forwards;
  }
  @keyframes burst {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; }
  }

  /* ===== 结束遮罩 ===== */
  .overlay {
    position: absolute; inset: 0; z-index: 40;
    background: rgba(47,53,66,0.45); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    background: #FFFFFF; border-radius: 28px;
    padding: 28px 32px; text-align: center;
    transform: scale(.9); transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    width: 78%; max-width: 300px;
  }
  .overlay.show .modal { transform: scale(1); }
  .modal .emoji { font-size: 52px; margin-bottom: 8px; }
  .modal h2 { font-size: 22px; font-weight: 800; color: #2F3542; margin-bottom: 4px; }
  .modal .sub { font-size: 13px; color: #9AA0A8; margin-bottom: 16px; }
  .modal .score-line { font-size: 15px; color: #6B7280; margin-bottom: 4px; }
  .modal .score-line b { font-size: 20px; color: #2F3542; }
  .modal .newbest { font-size: 12px; color: #FF7B93; font-weight: 700; margin-bottom: 14px; }
  .modal .btn { width: 100%; padding: 13px; font-size: 15px; border-radius: 16px; }
</style>
</head>
<body>
<div class="game" id="game">
  <div class="topbar">
    <div class="title">动物泡澡<small>ANIMAL BATH · 手搓版</small></div>
    <div class="scorebox">
      <div class="score-label">本局洗浴值</div>
      <div class="score" id="score">0</div>
      <div class="best">最高 <span id="best">0</span></div>
    </div>
  </div>

  <div class="next-row">
    <span class="next-label">下一个</span>
    <div class="next-slot current" id="next1"><span class="cur-tag">当前</span></div>
    <div class="next-slot" id="next2"></div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board">
      <div class="cols-bg" id="colsBg"></div>
      <div class="danger-line" id="dangerLine"></div>
      <div class="danger-tag" id="dangerTag">警戒线</div>
      <div class="cols" id="cols"></div>
      <div class="fx-layer" id="fx"></div>
    </div>
  </div>

  <div class="bottombar">
    <div class="hint">点<b>列</b>投放，相同动物<b>自动合成</b><br><span class="combo" id="combo"></span></div>
    <button class="btn restart" id="restartBtn">重新开始</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="emoji">🛁</div>
      <h2 id="endTitle">游戏结束</h2>
      <div class="sub" id="endSub">动物把浴池堆满了</div>
      <div class="score-line">本局洗浴值 <b id="endScore">0</b></div>
      <div class="newbest" id="newBest" style="display:none">🏆 新纪录！</div>
      <button class="btn" id="againBtn">再来一局</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  // ===== 配置 =====
  const COLS = 5;
  const MAX_LEVEL = 11;
  const MAX_ROWS = 12;       // 最多堆 12 层（窗口够高时）
  let overRow = 12;          // 当前实际警戒层数（fitBoard 自适应）

  // 动物表：1-11 级（渐变：顶部亮 → 底部深，配合左上高光更有立体感）
  const ANIMALS = ['🐶','🐷','🐸','🐻','🐘','🐑','🐯','🦊','🐨','🐢','🦉'];
  const GRADS = [
    'linear-gradient(160deg,#FFEFB0,#FFD75E 55%,#F0B62E)',   // 1 黄
    'linear-gradient(160deg,#FFD8E3,#FFB3C7 55%,#F58BA6)',   // 2 粉
    'linear-gradient(160deg,#CBF2B2,#A9E38A 55%,#84C96A)',   // 3 绿
    'linear-gradient(160deg,#EAC89E,#D9A878 55%,#BC8857)',   // 4 棕
    'linear-gradient(160deg,#B8DDFF,#8FC7FF 55%,#6AA9E8)',   // 5 蓝
    'linear-gradient(160deg,#FFFFFF,#F3F0E6 55%,#DCD8CC)',   // 6 白
    'linear-gradient(160deg,#FFCD88,#FFA94D 55%,#F08C2E)',   // 7 橙
    'linear-gradient(160deg,#FFB2A6,#FF8A7A 55%,#F0675A)',   // 8 红
    'linear-gradient(160deg,#D6D1E0,#B9B2C7 55%,#9992A8)',   // 9 灰
    'linear-gradient(160deg,#A5EAC6,#7ED6A5 55%,#5BBE87)',   // 10 翠
    'linear-gradient(160deg,#DECAF8,#C3A6F2 55%,#A687DC)'    // 11 紫
  ];

  // 新动物生成：从小到大，大数字只能靠合成
  //  · 掉落上限随投放次数缓慢放开：0-29投只有 1-3，30投出4，60投出5，90投才到 6
  //  · 7 级以上（7-11）永远不会直接掉落，只能靠合成
  //  · 权重集中在 1-3（合成的基础），4-6 概率低
  let dropCount = 0;         // 已投放次数（难度进度）

  function rollLevel(){
    // 当前允许掉落的最高等级：3 → 4 → 5 → 6（约 30 投 +1，上限 6）
    const maxDrop = Math.min(6, 3 + Math.floor(dropCount / 30));
    const d = Math.min(1, dropCount / 120);   // 进度 0→1
    const center = 2 + d * 1.2;               // 重心缓慢从 2 移到 3.2
    const sigma = 1.0 + d * 1.2;              // 后期分布略宽
    const w = [];
    for (let i = 1; i <= maxDrop; i++){
      const dist = Math.abs(i - center);
      let weight = Math.exp(-(dist * dist) / (2 * sigma * sigma));
      // 保底：1、2、3 始终高频（合成的基础，保证游戏可持续）
      if (i === 1) weight += 2.5;
      if (i === 2) weight += 2.0;
      if (i === 3) weight += 1.2;
      w.push(Math.max(weight, 0.25));
    }
    const total = w.reduce((a,b)=>a+b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < w.length; i++){
      r -= w[i];
      if (r <= 0) return i + 1;
    }
    return 1;
  }

  // ===== 音效（Web Audio 轻量合成） =====
  let actx = null;
  function beep(freq, dur, type, vol, when){
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const t = actx.currentTime + (when || 0);
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.1));
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + (dur || 0.1) + 0.03);
    } catch(e){}
  }

  // ===== 状态 =====
  let stacks = [];       // 每列数组（底部 -> 顶部）
  let score = 0;
  let combo = 0;
  let best = 0;
  try { best = parseInt(localStorage.getItem('animalBathBest') || '0', 10); } catch (e) { /* file:// 下部分浏览器禁止 localStorage，忽略 */ }
  let nextQueue = [rollLevel(), rollLevel()];
  let running = false;
  let busy = false;      // 合成动画进行中，禁止继续投放

  const board = document.getElementById('board');
  const colsEl = document.getElementById('cols');
  const colsBg = document.getElementById('colsBg');
  const fx = document.getElementById('fx');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const comboEl = document.getElementById('combo');
  const next1El = document.getElementById('next1');
  const next2El = document.getElementById('next2');
  const overlay = document.getElementById('overlay');
  const endScore = document.getElementById('endScore');
  const newBestEl = document.getElementById('newBest');

  bestEl.textContent = best.toLocaleString();

  // ===== 渲染 =====
  function tileHTML(level, extra=''){
    return `<div class="tile ${extra}" data-level="${level}" style="background:${GRADS[level-1]}">${ANIMALS[level-1]}<span class="num">${level}</span></div>`;
  }

  function render(){
    colsEl.innerHTML = '';
    for (let c = 0; c < COLS; c++){
      const col = document.createElement('div');
      col.className = 'col';
      col.dataset.col = c;
      const arrow = document.createElement('div');
      arrow.className = 'arrow';
      arrow.textContent = '▼';
      const stack = document.createElement('div');
      stack.className = 'stack';
      // 从底到顶渲染（DOM顺序=栈底→栈顶，column-reverse 让栈底在视觉底部）
      for (let i = 0; i < stacks[c].length; i++){
        const d = document.createElement('div');
        d.innerHTML = tileHTML(stacks[c][i]);
        stack.appendChild(d.firstChild);
      }
      col.appendChild(arrow);
      col.appendChild(stack);
      colsEl.appendChild(col);
    }
  }

  function renderNext(){
    next1El.querySelectorAll('.tile').forEach(t => t.remove());
    next2El.querySelectorAll('.tile').forEach(t => t.remove());
    const d1 = document.createElement('div');
    d1.innerHTML = tileHTML(nextQueue[0]);
    next1El.appendChild(d1.firstChild);
    const d2 = document.createElement('div');
    d2.innerHTML = tileHTML(nextQueue[1]);
    next2El.appendChild(d2.firstChild);
  }

  function updateScore(){
    scoreEl.textContent = score.toLocaleString();
    if (score > best) bestEl.textContent = score.toLocaleString();
  }

  // ===== 警戒线动态定位 + 棋子自适应尺寸 =====
  const dangerLine = document.getElementById('dangerLine');
  const dangerTag = document.getElementById('dangerTag');
  const rootStyle = document.documentElement.style;

  function fitBoard(){
    const boardH = board.clientHeight;
    const boardW = board.clientWidth;
    if (!boardH || !boardW) return;
    const gap = 2;
    // 紧凑大格子：方块尺寸 = 列宽（列与列之间几乎无空隙，像原版）
    const tile = Math.max(34, Math.floor((boardW - 10) / COLS) - 2);
    // 层数：能堆几层堆几层（原版就是 4-6 层的大格子棋盘）
    const avail = boardH - 14;
    overRow = Math.max(3, Math.floor(avail / (tile + gap)));
    rootStyle.setProperty('--tile', tile + 'px');
    rootStyle.setProperty('--gap', gap + 'px');
    rootStyle.setProperty('--tile-font', Math.round(tile * 0.5) + 'px');
    // 警戒线 = 第 overRow 层的顶部（始终贴近堆叠上限）
    const top = Math.max(6, boardH - 7 - overRow * (tile + gap));
    dangerLine.style.top = top + 'px';
    dangerTag.style.top = (top - 12) + 'px';
  }

  // ===== 特效 =====
  function spawnFX(colIdx, level, chain, targetEl){
    const boardRect = board.getBoundingClientRect();
    let cx, y;
    if (targetEl){
      const r = targetEl.getBoundingClientRect();
      cx = r.left - boardRect.left + r.width / 2;
      y = r.top - boardRect.top + r.height / 2;
    } else {
      const colW = boardRect.width / COLS;
      cx = colW * colIdx + colW / 2;
      y = 200;
    }

    // 浮动文字
    const gain = Math.round(level * 15 * (1 + 0.3 * (chain - 1)));
    const ft = document.createElement('div');
    ft.className = 'float-text';
    ft.textContent = chain > 1 ? `连击 x${chain} · 洗浴值 +${gain}` : `洗浴值 +${gain}`;
    ft.style.left = (cx - 50) + 'px';
    ft.style.top = y + 'px';
    fx.appendChild(ft);

    // 粒子
    const colors = ['#FF7B93','#FFD75E','#7ED6A5','#8FC7FF'];
    for (let i = 0; i < 8; i++){
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = cx + 'px';
      p.style.top = y + 'px';
      p.style.width = p.style.height = (4 + Math.random()*6) + 'px';
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      const ang = Math.random() * Math.PI * 2;
      const dist = 30 + Math.random() * 40;
      p.style.setProperty('--dx', Math.cos(ang)*dist + 'px');
      p.style.setProperty('--dy', Math.sin(ang)*dist + 'px');
      fx.appendChild(p);
    }
    setTimeout(() => {
      ft.remove();
      fx.querySelectorAll('.particle').forEach(p => p.remove());
    }, 1100);
  }

  // ===== 投放（点击列） =====
  function drop(colIdx){
    if (!running || busy) return;
    busy = true;
    dropCount++;
    const level = nextQueue.shift();
    nextQueue.push(rollLevel());
    renderNext();

    stacks[colIdx].push(level);
    render();

    // 落子动画：新棋子（栈顶）从顶部掉入
    const colEl = colsEl.children[colIdx];
    const tiles = colEl.querySelectorAll('.stack .tile');
    const landed = tiles[tiles.length - 1];
    if (landed){
      landed.classList.add('fall');
      setTimeout(() => landed.classList.remove('fall'), 260);
    }
    beep(300 + level * 30, 0.06, 'triangle', 0.07);   // 落子声（等级越高音越高）

    // 自动合成：相邻相同合并升级（分步动画），连锁（稍等落子动画）
    setTimeout(async () => {
      try {
        await settleMerge(colIdx);
      } catch (e) {
        console.error('settleMerge error:', e);
        render();  // 异常时兜底：重建棋盘，避免状态错乱
      } finally {
        busy = false;  // 无论合成是否正常完成，都解锁投放，防止卡死
        checkGameOver();
      }
    }, 230);
  }

  // ===== 自动合成（分步动画版） =====
  // 规则（对齐原版 + 玩家反馈）：
  //  · 合成只发生在"掉落/上次合成"位置附近——别处的相邻相同方块保持原样，
  //    等玩家投到那列才会触发，不会投一个小方块就把别处大数字也合掉
  //  · 新方块落下时吸收周围一圈（上/下/左/右）的相同方块一起合，
  //    吸收 k 个 → 跳 k 级（2个→+1，3个→+2，如 3+3+3 → 5），结果留在掉落位置
  //  · 每组合成都播放完整过程：碰撞闪烁 → 旧方块缩小消失 → 新数字弹出，
  //    然后再找下一对，连锁直到稳定
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // 以 (colIdx, row) 为中心，找所有相邻相同方块（上/下/左/右）
  // 关键1：合成只发生在"掉落/上次合成"位置附近——别处的相邻相同方块保持原样，
  //        不会因为投了一个小方块就把棋盘另一角的大数字也合掉
  // 关键2：新方块落下时会把"周围一圈"的相同方块全部吸收进来一起合，
  //        吸收 k 个 → 跳 k 级（2个→+1级，3个→+2级，如 3+3+3 → 5）
  function findNeighbors(colIdx, row){
    const level = stacks[colIdx][row];
    const same = [];
    if (row > 0 && stacks[colIdx][row-1] === level) same.push({col: colIdx, row: row-1});            // 下
    if (row < stacks[colIdx].length - 1 && stacks[colIdx][row+1] === level) same.push({col: colIdx, row: row+1});  // 上
    if (colIdx > 0 && stacks[colIdx-1][row] === level) same.push({col: colIdx-1, row: row});          // 左
    if (colIdx < COLS - 1 && stacks[colIdx+1][row] === level) same.push({col: colIdx+1, row: row});   // 右
    return same;
  }

  // 参与合成的一组方块碰撞闪烁（中心 + 所有被吸收的）
  function flashSet(colIdx, row, same){
    return new Promise(resolve => {
      const els = [];
      const tiles0 = colsEl.children[colIdx].querySelectorAll('.stack .tile');
      const center = tiles0[row];
      if (center) els.push(center);
      for (const s of same){
        const tiles = colsEl.children[s.col].querySelectorAll('.stack .tile');
        const el = tiles[s.row];
        if (el) els.push(el);
      }
      els.forEach(el => el.classList.add('merge-flash'));
      beep(330, 0.07, 'triangle', 0.06);
      setTimeout(() => {
        els.forEach(el => el.classList.remove('merge-flash'));
        resolve();
      }, 280);
    });
  }

  // 被吸收的旧方块缩小淡出（render 前播放）
  function goneSet(same){
    return new Promise(resolve => {
      const els = [];
      for (const s of same){
        const tiles = colsEl.children[s.col].querySelectorAll('.stack .tile');
        const el = tiles[s.row];
        if (el) els.push(el);
      }
      if (els.length === 0) return resolve();
      let pending = els.length;
      els.forEach(el => {
        el.classList.add('merge-gone');
        setTimeout(() => { el.classList.remove('merge-gone'); pending--; if (pending <= 0) resolve(); }, 250);
      });
    });
  }

  async function settleMerge(colIdx){
    let chains = 0;
    let lastCol = colIdx, lastRow = stacks[colIdx].length - 1;
    while (true){
      const same = findNeighbors(lastCol, lastRow);
      if (same.length === 0) break;
      const level = stacks[lastCol][lastRow];
      // 吸收 k 个相同 → 跳 k 级（结果留在掉落位置）
      const nl = Math.min(level + same.length, MAX_LEVEL);
      // 1) 预备：所有参与方块碰撞闪烁
      await flashSet(lastCol, lastRow, same);
      // 2) 被吸收的方块缩小消失
      await goneSet(same);
      // 3) 应用合并：先删被吸收的（同列从高 row 往下删，避免索引错乱）
      const below = same.filter(s => s.col === lastCol && s.row < lastRow).length;
      const sorted = [...same].sort((a, b) => b.row - a.row);
      for (const s of sorted){
        stacks[s.col].splice(s.row, 1);
      }
      const newRow = lastRow - below;   // 删除下方方块后，结果位置上移
      stacks[lastCol][newRow] = nl;
      lastRow = newRow;
      chains++;
      render();
      // 4) 新数字弹出动画 + 合成音
      const tiles = colsEl.children[lastCol].querySelectorAll('.stack .tile');
      const el = tiles[lastRow];
      if (el){
        el.classList.add('merge-pop');
        setTimeout(() => el.classList.remove('merge-pop'), 500);
      }
      beep(420 + nl * 45, 0.12, 'sine', 0.13);
      await sleep(320);
    }
    if (chains === 0) return;

    combo = Math.max(combo, chains);
    // 计分：取棋盘上最大等级作为本次合成的代表等级
    let topLevel = 0;
    for (let c = 0; c < COLS; c++){
      for (const v of stacks[c]) topLevel = Math.max(topLevel, v);
    }
    const gain = Math.round(topLevel * 15 * (1 + 0.3 * (chains - 1)));
    score += gain;
    updateScore();

    const colEl = colsEl.children[lastCol];
    const tiles = colEl.querySelectorAll('.stack .tile');
    const result = tiles[lastRow];
    spawnFX(lastCol, topLevel, chains, result);

    // 连锁结束的升调音效
    if (chains > 1) beep(420 + topLevel * 45 * 1.5, 0.16, 'sine', 0.11, 0.07);

    if (chains > 1){
      comboEl.textContent = `连击 x${chains}`;
      setTimeout(() => { comboEl.textContent = ''; }, 1300);
    }
  }

  function checkGameOver(){
    let over = false;
    for (let c = 0; c < COLS; c++){
      if (stacks[c].length > overRow) { over = true; break; }
    }
    if (over){
      running = false;
      if (score > best){
        best = score;
        try { localStorage.setItem('animalBathBest', String(best)); } catch (e) { /* 忽略：无法保存最高分不影响游玩 */ }
        bestEl.textContent = best.toLocaleString();
        newBestEl.style.display = 'block';
      } else {
        newBestEl.style.display = 'none';
      }
      endScore.textContent = score.toLocaleString();
      setTimeout(() => overlay.classList.add('show'), 500);
    }
  }

  // ===== 初始化 =====
  function init(){
    stacks = [];
    for (let c = 0; c < COLS; c++) stacks.push([]);
    score = 0; combo = 0; dropCount = 0;
    running = true; busy = false;
    updateScore();
    comboEl.textContent = '';
    nextQueue = [rollLevel(), rollLevel()];
    render();
    renderNext();
    overlay.classList.remove('show');
    fitBoard();
  }

  // 列背景
  for (let c = 0; c < COLS; c++){
    const bg = document.createElement('div');
    bg.className = 'col-bg';
    colsBg.appendChild(bg);
  }

  // 事件：点击列 = 投放（列上的动物也响应，相邻相同自动合成）
  colsEl.addEventListener('click', (e) => {
    const col = e.target.closest('.col');
    if (col) drop(parseInt(col.dataset.col, 10));
  });
  // 键盘 1-5 投放
  document.addEventListener('keydown', (e) => {
    if (/^[1-5]$/.test(e.key)) drop(parseInt(e.key, 10) - 1);
  });

  document.getElementById('restartBtn').addEventListener('click', init);
  document.getElementById('againBtn').addEventListener('click', init);
  window.addEventListener('resize', fitBoard);

  init();
})();
</script>
</body>
</html>
