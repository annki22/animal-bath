<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>动物泡澡 · 手搓版</title>
<!-- v4：新增昵称登录、云端排行榜（Supabase）、本局续玩（本地+云端存档） -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    background: #F5F4F0;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  .game {
    width: 100%; max-width: 420px; height: 100vh; height: 100dvh; max-height: 860px;
    background: linear-gradient(180deg, #EAF3F5 0%, #F7F4EC 40%, #F5F4F0 100%);
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }

  /* ===== 顶部 ===== */
  .topbar {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 14px 16px 4px;
  }
  .title { font-size: 20px; font-weight: 800; letter-spacing: 1px; color: #2F3542; }
  .title small { display: block; font-size: 11px; font-weight: 500; color: #9AA0A8; letter-spacing: 2px; margin-top: 2px; }
  .scorebox { text-align: right; }
  .score-label { font-size: 10px; color: #9AA0A8; letter-spacing: 1px; }
  .score { font-size: 26px; font-weight: 800; color: #2F3542; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .best { font-size: 11px; color: #B8BEC6; margin-top: 2px; }

  /* ===== 预览区（当前动物 + 下一个） ===== */
  .next-row {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 8px 16px 6px;
  }
  .next-label { font-size: 11px; color: #9AA0A8; letter-spacing: 1px; margin-right: 2px; }
  .next-slot {
    width: 52px; height: 52px; border-radius: 14px;
    background: rgba(255,255,255,0.75);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .next-slot.current { background: #FFF6DE; box-shadow: inset 0 0 0 2px #FFD75E; }
  /* 预览区方块：独立正方形尺寸，不受棋盘 --tile 影响 */
  .next-slot .tile {
    width: calc(var(--tile, 40px) * .62);
    height: calc(var(--tile, 40px) * .62);
    font-size: calc(var(--tile-font, 21px) * .78);
    border-radius: calc(var(--tile, 40px) * .18);
    animation: popIn .25s ease;
  }
  @keyframes popIn { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .cur-tag {
    position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    font-size: 9px; font-weight: 700; color: #B8860B; letter-spacing: 1px;
  }

  /* ===== 棋盘 ===== */
  .board-wrap { flex: 1; padding: 6px 12px 10px; position: relative; }
  /* 棋盘（泡泡浴缸底） */
  .board {
    position: relative; height: 100%;
    background:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,.55) 0 5px, transparent 6.5px),
      radial-gradient(circle at 78% 10%, rgba(255,255,255,.45) 0 4px, transparent 5.5px),
      radial-gradient(circle at 55% 26%, rgba(255,255,255,.35) 0 3px, transparent 4px),
      radial-gradient(circle at 30% 68%, rgba(255,255,255,.4) 0 4px, transparent 5.5px),
      radial-gradient(circle at 88% 62%, rgba(255,255,255,.3) 0 3px, transparent 4px),
      linear-gradient(180deg, #E8F6FA 0%, #D6ECF1 100%);
    border-radius: 24px;
    border: 3px solid #CBE4EA;
    overflow: hidden;
  }
  .cols-bg {
    position: absolute; inset: 0;
    display: grid; grid-template-columns: repeat(5, 1fr);
    padding: 4px;
  }
  .col-bg {
    background: rgba(212,236,242,0.6);
    border-radius: 6px;
    margin: 1px;
  }
  .col-bg:nth-child(odd) { background: rgba(190,226,235,0.65); }
  /* 警戒线 */
  .danger-line {
    position: absolute; left: 10px; right: 10px; top: 62px;
    border-top: 3px dashed #FF7B93;
    opacity: .55; pointer-events: none;
  }
  .danger-tag {
    position: absolute; right: 8px; top: 50px;
    font-size: 9px; color: #FF7B93; letter-spacing: 1px; font-weight: 600;
    pointer-events: none;
  }

  /* 棋子 */
  .tile {
    width: var(--tile, 40px); height: var(--tile, 40px);
    border-radius: calc(var(--tile, 40px) * .24);
    position: relative;
    display: flex; align-items: center; justify-content: center;
    font-size: var(--tile-font, 21px);
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,.5),
      inset 0 -4px 0 rgba(0,0,0,.10),
      0 2px 5px rgba(60,110,125,.20);
    cursor: pointer;
    transition: transform .15s;
  }
  /* 左上高光，增加立体感 */
  .tile::before {
    content: '';
    position: absolute; top: 9%; left: 12%;
    width: 30%; height: 20%;
    border-radius: 50%;
    background: rgba(255,255,255,.5);
    pointer-events: none;
  }
  .tile .num {
    position: absolute; bottom: 4%; left: 50%; transform: translateX(-50%);
    color: #fff;
    font-size: calc(var(--tile, 40px) * .32); font-weight: 900;
    line-height: 1; letter-spacing: 0;
    text-shadow:
      0 1px 1px rgba(0,0,0,.45),
      0 0 2px rgba(0,0,0,.65),
      0 0 6px rgba(0,0,0,.35);
    pointer-events: none;
  }
  .tile.highlight { animation: mergeFlash .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes mergeFlash {
    0% { transform: scale(1.5) translateY(-4px); filter: brightness(1.6); }
    60% { transform: scale(.94) translateY(1px); filter: brightness(1.15); }
    100% { transform: scale(1) translateY(0); filter: brightness(1); }
  }
  .tile.fall { animation: fallIn .24s cubic-bezier(.22,.9,.3,1); }
  @keyframes fallIn {
    0% { transform: translateY(-150px) scale(.9); opacity: .4; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  .tile.shake { animation: shake .3s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  .tile.merge-pop { animation: mergePop .45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes mergePop {
    0% { transform: scale(.3); opacity: .4; }
    100% { transform: scale(1); opacity: 1; }
  }
  /* 合成预备：两个方块碰撞闪烁 */
  .tile.merge-flash {
    animation: mergeFlash .26s ease;
    z-index: 30;
  }
  @keyframes mergeFlash {
    0% { transform: scale(1); filter: brightness(1); }
    40% { transform: scale(1.22) translateY(-3px); filter: brightness(1.7); }
    100% { transform: scale(1); filter: brightness(1); }
  }
  /* 合成消失：参与合成的旧方块缩小淡出 */
  .tile.merge-gone {
    animation: mergeGone .24s ease forwards;
    z-index: 30;
  }
  @keyframes mergeGone {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(.15); opacity: 0; }
  }

  /* 列（点击层） */
  .cols {
    position: absolute; inset: 0;
    display: grid; grid-template-columns: repeat(5, 1fr);
    z-index: 5;
  }
  .col {
    position: relative;
    display: flex; flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: background .12s;
    border-radius: 24px;
  }
  .col:active { background: rgba(255,255,255,0.3); }
  /* 棋子堆：从底部往上堆，栈顶在最上 */
  .col .stack {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 8px;
    display: flex; flex-direction: column-reverse;
    align-items: center; gap: var(--gap, 3px);
    pointer-events: none;
  }
  .col .stack .tile { pointer-events: auto; }
  .col .arrow {
    position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    width: 30px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    color: #7FB6C4; font-size: 14px; font-weight: 700;
    opacity: .7; pointer-events: none;
  }

  /* ===== 底部 ===== */
  .bottombar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px 14px;
  }
  .hint { font-size: 11px; color: #9AA0A8; line-height: 1.5; }
  .hint b { color: #7FB6C4; }
  .combo { font-size: 13px; font-weight: 700; color: #FF7B93; min-height: 18px; letter-spacing: 1px; }
  /* 连消 5+ 的庆祝提示：弹入 → 停留 → 自动淡出（总时长 1.6s，不阻塞游戏） */
  #celebration {
    position: absolute; top: 42%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 34px; font-weight: 800; letter-spacing: 2px;
    color: #FF8A3D;
    text-shadow: 0 2px 14px rgba(255, 138, 61, .45);
    white-space: nowrap; pointer-events: none; z-index: 30;
    opacity: 0;
  }
  #celebration.show { animation: celebPop 1.6s ease forwards; }
  @keyframes celebPop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.5); }
    15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    30%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    72%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.06); }
  }
  .btn {
    border: none; cursor: pointer;
    font-size: 13px; font-weight: 700; letter-spacing: 1px;
    padding: 10px 18px; border-radius: 14px;
    background: #2F3542; color: #fff;
    transition: transform .12s, opacity .2s;
  }
  .btn:active { transform: scale(.94); }
  .btn.restart { background: #E8E6E0; color: #6B7280; }
  .btn.mute-btn { width: 48px; padding: 13px 0; text-align: center; font-size: 16px; flex: none; }

  /* ===== 特效层 ===== */
  .fx-layer { position: absolute; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
  .float-text {
    position: absolute; font-weight: 800; color: #FF7B93;
    font-size: 15px; animation: floatUp 1s ease forwards;
    text-shadow: 0 1px 0 rgba(255,255,255,.8);
    white-space: nowrap;
  }
  @keyframes floatUp {
    0% { transform: translateY(0); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(-70px); opacity: 0; }
  }
  .particle {
    position: absolute; border-radius: 50%;
    animation: burst .7s ease-out forwards;
  }
  @keyframes burst {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; }
  }

  /* ===== 结束遮罩 ===== */
  .overlay {
    position: absolute; inset: 0; z-index: 40;
    background: rgba(47,53,66,0.45); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    background: #FFFFFF; border-radius: 28px;
    padding: 28px 32px; text-align: center;
    transform: scale(.9); transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    width: 78%; max-width: 300px;
  }
  .overlay.show .modal { transform: scale(1); }
  .modal .emoji { font-size: 52px; margin-bottom: 8px; }
  .modal h2 { font-size: 22px; font-weight: 800; color: #2F3542; margin-bottom: 4px; }
  .modal .sub { font-size: 13px; color: #9AA0A8; margin-bottom: 16px; }
  .modal .score-line { font-size: 15px; color: #6B7280; margin-bottom: 4px; }
  .modal .score-line b { font-size: 20px; color: #2F3542; }
  .modal .newbest { font-size: 12px; color: #FF7B93; font-weight: 700; margin-bottom: 14px; }
  .modal .submit-status { font-size: 12px; color: #34C759; font-weight: 600; margin-bottom: 12px; min-height: 16px; }
  .modal .submit-status.fail { color: #FF7B93; }
  .modal .btn { width: 100%; padding: 13px; font-size: 15px; border-radius: 16px; }
  .btn.ghost { background: #E8E6E0; color: #6B7280; margin-top: 8px; }

  /* ===== 昵称 & 排行榜 ===== */
  .who { font-size: 11px; color: #7FB6C4; margin-top: 3px; cursor: pointer; font-weight: 600; }
  .name-input {
    width: 100%; padding: 12px 14px; margin-bottom: 12px;
    font-size: 15px; font-weight: 600; text-align: center;
    border: 2px solid #E8E6E0; border-radius: 14px; outline: none;
    background: #F8F7F4; color: #2F3542;
  }
  .name-input:focus { border-color: #7FB6C4; background: #fff; }
  .rank-list { max-height: 300px; overflow-y: auto; text-align: left; margin: 6px 0 10px; -webkit-overflow-scrolling: touch; }
  .rank-row { display: flex; align-items: center; padding: 8px 6px; border-bottom: 1px solid #F0EFEA; font-size: 14px; }
  .rank-row:last-child { border-bottom: none; }
  .rank-row.me { background: #FFF6DE; border-radius: 10px; }
  .rank-no { width: 32px; font-weight: 800; color: #9AA0A8; font-variant-numeric: tabular-nums; }
  .rank-row:nth-child(1) .rank-no { color: #F0B62E; }
  .rank-row:nth-child(2) .rank-no { color: #B8BEC6; }
  .rank-row:nth-child(3) .rank-no { color: #C88F5A; }
  .rank-name { flex: 1; font-weight: 600; color: #2F3542; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-score { font-weight: 800; color: #2F3542; font-variant-numeric: tabular-nums; }
  .rank-empty { color: #9AA0A8; font-size: 13px; padding: 20px 0; }
  .rank-mine { font-size: 12px; color: #9AA0A8; margin-bottom: 10px; }
  .rank-loading { color: #9AA0A8; font-size: 13px; padding: 24px 0; }
</style>
</head>
<body>
<div class="game" id="game">
  <div class="topbar">
    <div class="title">动物泡澡<small>ANIMAL BATH · 手搓版</small></div>
    <div class="scorebox">
      <div class="score-label">本局洗浴值</div>
      <div class="score" id="score">0</div>
      <div class="best">最高 <span id="best">0</span></div>
      <div class="who" id="whoBtn">👤 <span id="whoName">未登录</span></div>
    </div>
  </div>

  <div class="next-row">
    <span class="next-label">下一个</span>
    <div class="next-slot current" id="next1"><span class="cur-tag">当前</span></div>
    <div class="next-slot" id="next2"></div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board">
      <div class="cols-bg" id="colsBg"></div>
      <div class="danger-line" id="dangerLine"></div>
      <div class="danger-tag" id="dangerTag">警戒线</div>
      <div class="cols" id="cols"></div>
      <div class="fx-layer" id="fx"></div>
      <div id="celebration"></div>
    </div>
  </div>

  <div class="bottombar">
    <div class="hint">点<b>列</b>投放，相同动物<b>自动合成</b><br><span class="combo" id="combo"></span></div>
    <div style="display:flex; gap:8px;">
      <button class="btn restart mute-btn" id="muteBtn" title="静音">🔊</button>
      <button class="btn restart" id="rankBtn">🏆 排行</button>
      <button class="btn restart" id="restartBtn">重新开始</button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="emoji">🛁</div>
      <h2 id="endTitle">游戏结束</h2>
      <div class="sub" id="endSub">动物把浴池堆满了</div>
      <div class="score-line">本局洗浴值 <b id="endScore">0</b></div>
      <div class="newbest" id="newBest" style="display:none">🏆 新纪录！</div>
      <div class="submit-status" id="endSubmit" style="display:none"></div>
      <button class="btn" id="againBtn">再来一局</button>
      <button class="btn ghost" id="endRankBtn">查看排行榜</button>
    </div>
  </div>

  <!-- 昵称登录 -->
  <div class="overlay show" id="nameOverlay">
    <div class="modal">
      <div class="emoji">🛁</div>
      <h2>动物泡澡</h2>
      <div class="sub">输入昵称，和朋友 PK 洗浴值</div>
      <input class="name-input" id="nameInput" maxlength="12" placeholder="你的昵称">
      <button class="btn" id="nameStart">开始游戏</button>
      <button class="btn ghost" id="nameContinue" style="display:none">继续上一局</button>
    </div>
  </div>

  <!-- 排行榜 -->
  <div class="overlay" id="rankOverlay">
    <div class="modal">
      <div class="emoji">🏆</div>
      <h2>洗浴值排行榜</h2>
      <div class="rank-loading" id="rankLoading">加载中…</div>
      <div class="rank-list" id="rankList" style="display:none"></div>
      <div class="rank-mine" id="rankMine" style="display:none"></div>
      <button class="btn" id="rankClose">关闭</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  // ===== 配置 =====
  const COLS = 5;
  // v4.3: 合成无上限（11+11 → 12 → 13 …一直往上，2026-08-18 用户要求"不要卡在11"）
  // 等级超过 40 时动物回退 🐾、颜色用 HSL 自动生成（见 getAnimal/getGrad）
  const MAX_ROWS = 12;       // 最多堆 12 层（窗口够高时）
  let overRow = 12;          // 当前实际警戒层数（fitBoard 自适应）

  // ===== 云端（Supabase 免费版，排行榜 & 跨设备续玩） =====
  const SUPABASE_URL = 'https://prlngioyqqonxerssprb.supabase.co';
  const SB_KEY = 'sb_publishable_ZfjkcGbCOQviUu-uvwwluw_v-Pic-yw';
  const SB_HEADERS = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
  const NICK_KEY = 'animalBathNick';   // localStorage：昵称
  const SAVE_KEY = 'animalBathSave';   // localStorage：本局存档（续玩）

  // 动物表：1-40 级（渐变：顶部亮 → 底部深，配合左上高光更有立体感）
  // 40 级以后自动回退 🐾+数字（几乎不可能合到，纯防御）
  const ANIMALS = ['🐶','🐷','🐸','🐻','🐘','🐑','🐯','🦊','🐨','🐢','🦉','🦁','🐲','🦖','🐳',
    '🦄','🐺','🐱','🐼','🦍','🦓','🐴','🦒','🦛','🐹','🐰','🦝','🦫','🦨','🦡','🦔','🐿','🦇','🐧','🦆','🦅','🦜','🦚','🦢','🦩'];
  const GRADS = [
    'linear-gradient(160deg,#FFEFB0,#FFD75E 55%,#F0B62E)',   // 1 黄
    'linear-gradient(160deg,#FFD8E3,#FFB3C7 55%,#F58BA6)',   // 2 粉
    'linear-gradient(160deg,#CBF2B2,#A9E38A 55%,#84C96A)',   // 3 绿
    'linear-gradient(160deg,#EAC89E,#D9A878 55%,#BC8857)',   // 4 棕
    'linear-gradient(160deg,#B8DDFF,#8FC7FF 55%,#6AA9E8)',   // 5 蓝
    'linear-gradient(160deg,#FFFFFF,#F3F0E6 55%,#DCD8CC)',   // 6 白
    'linear-gradient(160deg,#FFCD88,#FFA94D 55%,#F08C2E)',   // 7 橙
    'linear-gradient(160deg,#FFB2A6,#FF8A7A 55%,#F0675A)',   // 8 红
    'linear-gradient(160deg,#D6D1E0,#B9B2C7 55%,#9992A8)',   // 9 灰
    'linear-gradient(160deg,#A5EAC6,#7ED6A5 55%,#5BBE87)',   // 10 翠
    'linear-gradient(160deg,#DECAF8,#C3A6F2 55%,#A687DC)',   // 11 紫
    'linear-gradient(160deg,#FFF3B8,#FFD700 55%,#DAA520)',   // 12 金
    'linear-gradient(160deg,#C9F5E5,#7FE0BE 55%,#4CB894)',   // 13 青
    'linear-gradient(160deg,#C5D9FF,#8FB3FF 55%,#5C7CE6)',   // 14 深蓝
    'linear-gradient(160deg,#FFC9E8,#FF8FD0 55%,#E85BA8)'    // 15 玫红
  ];
  // 超过渐变表的等级：HSL 色相轮转自动生成（保证一直往上合也有新颜色）
  function getGrad(level){
    if (level <= GRADS.length) return GRADS[level - 1];
    const h = (level * 47) % 360;
    return `linear-gradient(160deg,hsl(${h},82%,82%),hsl(${h},72%,68%) 55%,hsl(${h},62%,55%))`;
  }
  function getAnimal(level){
    return ANIMALS[level - 1] || '🐾';
  }

  // 新动物生成：从小到大，大数字只能靠合成
  //  · 掉落上限随投放次数放开：开局允许 5，30投出6（对齐原游戏节奏：开局即有 4/5 掉落）
  //  · 7 级以上（7-15）永远不会直接掉落，只能靠合成
  //  · 权重重心 3.4→4.2，1 级低频（原游戏实测 1 占比仅 ~11%）
  let dropCount = 0;         // 已投放次数（难度进度）

  function rollLevel(){
    // v4.2 掉落节奏：对齐原游戏《动物泳场》实测（2026-08-18 视频 265s 分析）
    //  · 原游戏开局就直接掉 4/5（前 80s 分布：1:11% 2:20% 3:24% 4:31% 5:13%），
    //    旧版开局只掉 1-3 且 1 占 ~47%，玩家反馈"1 太多、玩很久不见大数字"。
    //  · 新节奏：开局允许 5，30 投后出 6；重心 3.4 → 4.2，1 级不再是主力。
    const maxDrop = Math.min(6, 5 + Math.floor(dropCount / 30));
    const d = Math.min(1, dropCount / 100);   // 进度 0→1（100 投到顶）
    const center = 3.4 + d * 0.8;             // 重心 3.4 → 4.2
    const sigma = 1.15 + d * 0.3;             // 后期分布略宽
    const w = [];
    for (let i = 1; i <= maxDrop; i++){
      const dist = Math.abs(i - center);
      let weight = Math.exp(-(dist * dist) / (2 * sigma * sigma));
      // 保底：1、2、3 保持一定频率（合成的基础，保证游戏可持续），但大幅低于旧版
      if (i === 1) weight += 0.35;
      if (i === 2) weight += 0.55;
      if (i === 3) weight += 0.45;
      w.push(Math.max(weight, 0.2));
    }
    const total = w.reduce((a,b)=>a+b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < w.length; i++){
      r -= w[i];
      if (r <= 0) return i + 1;
    }
    return 1;
  }

  // ===== 音效（Web Audio 轻量合成） =====
  let actx = null;
  let muted = false;   // 全局静音：音效 + BGM 一起关（localStorage 持久化）
  try { muted = localStorage.getItem('animalBathMuted') === '1'; } catch (e) {}
  function beep(freq, dur, type, vol, when){
    if (muted) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const t = actx.currentTime + (when || 0);
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.1));
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + (dur || 0.1) + 0.03);
    } catch(e){}
  }

  // 合成成功专属音效：快速上行琶音（根音→大三度→纯五度），等级越高越亮
  // 单音 sine 太弱没辨识度，三连音才有"升级成功"的满足感
  function mergeSound(nl){
    if (muted) return;
    const base = 360 + nl * 42;
    beep(base, 0.09, 'square', 0.07);
    beep(base * 1.26, 0.10, 'triangle', 0.10, 0.06);
    beep(base * 1.5, 0.16, 'sine', 0.12, 0.13);
  }

  // ===== BGM（Web Audio 程序化合成，无外部文件，单文件自包含） =====
  // C 大调五声音阶轻快旋律（BPM≈150，每音 0.4s，16 步 6.4s 循环）
  // 低音 I-V-vi-IV（C G A F）每 4 步一个，与旋律 16 步完美对齐
  const BGM_MELODY = [523.25, 659.25, 783.99, 880.00, 783.99, 659.25, 587.33, 523.25,
                      440.00, 523.25, 659.25, 783.99, 659.25, 587.33, 523.25, 440.00];
  const BGM_BASS   = [130.81, 196.00, 220.00, 174.61];
  let bgmTimer = null, bgmStep = 0;
  function playTone(freq, when, dur, type, vol){
    try {
      if (!actx) return;
      const t = actx.currentTime + when;
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur + 0.05);
    } catch(e){}
  }
  function startBGM(){
    if (muted || bgmTimer) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      bgmStep = 0;
      bgmTimer = setInterval(bgmTick, 400);
    } catch(e){}
  }
  function stopBGM(){
    if (bgmTimer){ clearInterval(bgmTimer); bgmTimer = null; }
  }
  function bgmTick(){
    if (!actx || actx.state === 'suspended') return;
    const i = bgmStep % BGM_MELODY.length;
    playTone(BGM_MELODY[i], 0, 0.34, 'triangle', 0.085);
    if (bgmStep % 4 === 0) playTone(BGM_BASS[(bgmStep / 4) % BGM_BASS.length | 0], 0, 0.38, 'sine', 0.095);
    bgmStep++;
  }

  // ===== 状态 =====
  let stacks = [];       // 每列数组（底部 -> 顶部）
  let score = 0;
  let combo = 0;
  let best = 0;
  try { best = parseInt(localStorage.getItem('animalBathBest') || '0', 10); } catch (e) { /* file:// 下部分浏览器禁止 localStorage，忽略 */ }
  let nextQueue = [rollLevel(), rollLevel()];
  let running = false;
  let busy = false;      // 合成动画进行中，禁止继续投放
  let nickname = '';     // 当前玩家昵称
  let cloudTimer = null; // 云端存档防抖

  const board = document.getElementById('board');
  const colsEl = document.getElementById('cols');
  const colsBg = document.getElementById('colsBg');
  const fx = document.getElementById('fx');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const comboEl = document.getElementById('combo');
  const next1El = document.getElementById('next1');
  const next2El = document.getElementById('next2');
  const overlay = document.getElementById('overlay');
  const endScore = document.getElementById('endScore');
  const endSubmit = document.getElementById('endSubmit');
  const newBestEl = document.getElementById('newBest');
  const nameOverlay = document.getElementById('nameOverlay');
  const nameInput = document.getElementById('nameInput');
  const nameStart = document.getElementById('nameStart');
  const nameContinue = document.getElementById('nameContinue');
  const whoNameEl = document.getElementById('whoName');
  const rankOverlay = document.getElementById('rankOverlay');
  const rankList = document.getElementById('rankList');
  const rankMine = document.getElementById('rankMine');
  const rankLoading = document.getElementById('rankLoading');

  bestEl.textContent = best.toLocaleString();
  try { nickname = localStorage.getItem(NICK_KEY) || ''; } catch (e) {}
  whoNameEl.textContent = nickname || '未登录';

  // ===== 渲染 =====
  function tileHTML(level, extra=''){
    return `<div class="tile ${extra}" data-level="${level}" style="background:${getGrad(level)}">${getAnimal(level)}<span class="num">${level}</span></div>`;
  }

  function render(){
    colsEl.innerHTML = '';
    for (let c = 0; c < COLS; c++){
      const col = document.createElement('div');
      col.className = 'col';
      col.dataset.col = c;
      const arrow = document.createElement('div');
      arrow.className = 'arrow';
      arrow.textContent = '▼';
      const stack = document.createElement('div');
      stack.className = 'stack';
      // 从底到顶渲染（DOM顺序=栈底→栈顶，column-reverse 让栈底在视觉底部）
      for (let i = 0; i < stacks[c].length; i++){
        const d = document.createElement('div');
        d.innerHTML = tileHTML(stacks[c][i]);
        stack.appendChild(d.firstChild);
      }
      col.appendChild(arrow);
      col.appendChild(stack);
      colsEl.appendChild(col);
    }
  }

  function renderNext(){
    next1El.querySelectorAll('.tile').forEach(t => t.remove());
    next2El.querySelectorAll('.tile').forEach(t => t.remove());
    const d1 = document.createElement('div');
    d1.innerHTML = tileHTML(nextQueue[0]);
    next1El.appendChild(d1.firstChild);
    const d2 = document.createElement('div');
    d2.innerHTML = tileHTML(nextQueue[1]);
    next2El.appendChild(d2.firstChild);
  }

  function updateScore(){
    scoreEl.textContent = score.toLocaleString();
    if (score > best) bestEl.textContent = score.toLocaleString();
  }

  // ===== 警戒线动态定位 + 棋子自适应尺寸 =====
  const dangerLine = document.getElementById('dangerLine');
  const dangerTag = document.getElementById('dangerTag');
  const rootStyle = document.documentElement.style;

  function fitBoard(){
    const boardH = board.clientHeight;
    const boardW = board.clientWidth;
    if (!boardH || !boardW) return;
    const gap = 2;
    // 紧凑大格子：方块尺寸 = 列宽（列与列之间几乎无空隙，像原版）
    const tile = Math.max(34, Math.floor((boardW - 10) / COLS) - 2);
    // 层数：能堆几层堆几层（原版就是 4-6 层的大格子棋盘）
    const avail = boardH - 14;
    overRow = Math.max(3, Math.floor(avail / (tile + gap)));
    rootStyle.setProperty('--tile', tile + 'px');
    rootStyle.setProperty('--gap', gap + 'px');
    rootStyle.setProperty('--tile-font', Math.round(tile * 0.5) + 'px');
    // 警戒线 = 第 overRow 层的顶部（始终贴近堆叠上限）
    const top = Math.max(6, boardH - 7 - overRow * (tile + gap));
    dangerLine.style.top = top + 'px';
    dangerTag.style.top = (top - 12) + 'px';
  }

  // ===== 特效 =====
  function spawnFX(colIdx, level, chain, targetEl){
    const boardRect = board.getBoundingClientRect();
    let cx, y;
    if (targetEl){
      const r = targetEl.getBoundingClientRect();
      cx = r.left - boardRect.left + r.width / 2;
      y = r.top - boardRect.top + r.height / 2;
    } else {
      const colW = boardRect.width / COLS;
      cx = colW * colIdx + colW / 2;
      y = 200;
    }

    // 浮动文字
    const gain = Math.round(level * 15 * Math.pow(1.3, chain - 1));   // 指数加成：连消越多加得越多
    const ft = document.createElement('div');
    ft.className = 'float-text';
    ft.textContent = chain > 1 ? `连击 x${chain} · 洗浴值 +${gain}` : `洗浴值 +${gain}`;
    ft.style.left = (cx - 50) + 'px';
    ft.style.top = y + 'px';
    fx.appendChild(ft);

    // 粒子
    const colors = ['#FF7B93','#FFD75E','#7ED6A5','#8FC7FF'];
    for (let i = 0; i < 8; i++){
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = cx + 'px';
      p.style.top = y + 'px';
      p.style.width = p.style.height = (4 + Math.random()*6) + 'px';
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      const ang = Math.random() * Math.PI * 2;
      const dist = 30 + Math.random() * 40;
      p.style.setProperty('--dx', Math.cos(ang)*dist + 'px');
      p.style.setProperty('--dy', Math.sin(ang)*dist + 'px');
      fx.appendChild(p);
    }
    setTimeout(() => {
      ft.remove();
      fx.querySelectorAll('.particle').forEach(p => p.remove());
    }, 1100);
  }

  // ===== 投放（点击列） =====
  function drop(colIdx){
    if (!running || busy) return;
    busy = true;
    if (!bgmTimer && !muted) startBGM();   // 兜底：任何投放手势都可启动 BGM（浏览器自动播放策略）
    dropCount++;
    const level = nextQueue.shift();
    nextQueue.push(rollLevel());
    renderNext();

    stacks[colIdx].push(level);
    render();

    // 落子动画：新棋子（栈顶）从顶部掉入
    const colEl = colsEl.children[colIdx];
    const tiles = colEl.querySelectorAll('.stack .tile');
    const landed = tiles[tiles.length - 1];
    if (landed){
      landed.classList.add('fall');
      setTimeout(() => landed.classList.remove('fall'), 260);
    }
    beep(300 + level * 30, 0.06, 'triangle', 0.07);   // 落子声（等级越高音越高）

    // 自动合成：相邻相同合并升级（分步动画），连锁（稍等落子动画）
    setTimeout(async () => {
      try {
        await settleMerge(colIdx);
      } catch (e) {
        console.error('settleMerge error:', e);
        render();  // 异常时兜底：重建棋盘，避免状态错乱
      } finally {
        busy = false;  // 无论合成是否正常完成，都解锁投放，防止卡死
        checkGameOver();
        if (running) saveGame();   // 每步落定后存档（续玩用）
      }
    }, 230);
  }

  // ===== 自动合成（分步动画版） =====
  // 规则（对齐原版 + 玩家反馈）：
  //  · 合成只发生在"掉落/上次合成"位置附近——别处的相邻相同方块保持原样，
  //    等玩家投到那列才会触发，不会投一个小方块就把别处大数字也合掉
  //  · 新方块落下时吸收周围一圈（上/下/左/右）的相同方块一起合，
  //    吸收 k 个 → 跳 k 级（2个→+1，3个→+2，如 3+3+3 → 5），结果留在掉落位置
  //  · 每组合成都播放完整过程：碰撞闪烁 → 旧方块缩小消失 → 新数字弹出，
  //    然后再找下一对，连锁直到稳定
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // 以 (colIdx, row) 为中心，找所有相邻相同方块（上/下/左/右）
  // 关键1：合成只发生在"掉落/上次合成"位置附近——别处的相邻相同方块保持原样，
  //        不会因为投了一个小方块就把棋盘另一角的大数字也合掉
  // 关键2：新方块落下时会把"周围一圈"的相同方块全部吸收进来一起合，
  //        吸收 k 个 → 跳 k 级（2个→+1级，3个→+2级，如 3+3+3 → 5）
  function findNeighbors(colIdx, row){
    const level = stacks[colIdx][row];
    const same = [];
    if (row > 0 && stacks[colIdx][row-1] === level) same.push({col: colIdx, row: row-1});            // 下
    if (row < stacks[colIdx].length - 1 && stacks[colIdx][row+1] === level) same.push({col: colIdx, row: row+1});  // 上
    if (colIdx > 0 && stacks[colIdx-1][row] === level) same.push({col: colIdx-1, row: row});          // 左
    if (colIdx < COLS - 1 && stacks[colIdx+1][row] === level) same.push({col: colIdx+1, row: row});   // 右
    return same;
  }

  // 参与合成的一组方块碰撞闪烁（中心 + 所有被吸收的）
  function flashSet(colIdx, row, same){
    return new Promise(resolve => {
      const els = [];
      const tiles0 = colsEl.children[colIdx].querySelectorAll('.stack .tile');
      const center = tiles0[row];
      if (center) els.push(center);
      for (const s of same){
        const tiles = colsEl.children[s.col].querySelectorAll('.stack .tile');
        const el = tiles[s.row];
        if (el) els.push(el);
      }
      els.forEach(el => el.classList.add('merge-flash'));
      beep(330, 0.07, 'triangle', 0.06);
      setTimeout(() => {
        els.forEach(el => el.classList.remove('merge-flash'));
        resolve();
      }, 280);
    });
  }

  // 被吸收的旧方块缩小淡出（render 前播放）
  function goneSet(same){
    return new Promise(resolve => {
      const els = [];
      for (const s of same){
        const tiles = colsEl.children[s.col].querySelectorAll('.stack .tile');
        const el = tiles[s.row];
        if (el) els.push(el);
      }
      if (els.length === 0) return resolve();
      let pending = els.length;
      els.forEach(el => {
        el.classList.add('merge-gone');
        setTimeout(() => { el.classList.remove('merge-gone'); pending--; if (pending <= 0) resolve(); }, 250);
      });
    });
  }

  async function settleMerge(colIdx){
    let chains = 0, guard = 0;
    let lastC = -1, lastR = -1;   // 最后一次合成/消除位置（spawnFX 用）
    // 队列式连锁（2026-08-18 v4.2 修复）：
    // 每次合成后，把"升级位置"和"每个删除位置的下移链"全部入队，逐个处理。
    // 修复 findCascade 两个漏洞：① 返回坐标错误（相同方块在相邻列时返回自己列，
    //   导致合成结果放错位置 → 同列相邻相同方块出现）；② 升级位置与删除列只能二选一，
    //   另一个被遗忘 → 棋盘遗留非法状态。
    const queue = new Set();
    queue.add(colIdx + ',' + (stacks[colIdx].length - 1));
    while (queue.size > 0){
      if (++guard > 500) break;   // 死循环保险
      const key = queue.values().next().value;
      queue.delete(key);
      const keyParts = key.split(',');
      const c = +keyParts[0], r = +keyParts[1];
      if (c < 0 || c >= COLS || r < 0 || r >= stacks[c].length) continue;  // 位置已失效
      const same = findNeighbors(c, r);
      if (same.length === 0) continue;
      const level = stacks[c][r];
      // 吸收 k 个相同 → 跳 k 级（结果留在当前处理位置）
      // v4.3: 无上限合成——11+11 → 12，一直往上（2026-08-18 用户要求"不要卡在11"）
      const nl = level + same.length;
      // 1) 预备：所有参与方块碰撞闪烁
      await flashSet(c, r, same);
      // 2) 被吸收的方块缩小消失
      await goneSet(same);
      // 3) 应用合并：先删被吸收的（同列从高 row 往下删，避免索引错乱）
      const below = same.filter(s => s.col === c && s.row < r).length;
      const sorted = [...same].sort((a, b) => b.row - a.row);
      for (const s of sorted){
        stacks[s.col].splice(s.row, 1);
      }
      const newRow = r - below;   // 删除下方方块后，结果位置上移
      stacks[c][newRow] = nl;
      chains++;
      lastC = c; lastR = newRow;
      render();
      // 4) 入队"升级位置"：升级后的方块可能与其邻居（含同列上下）相同，必须重新检查
      queue.add(c + ',' + newRow);
      // 5) 入队"删除位置的下移链"：splice 后受影响列上方方块整体下移，
      //    从删除位置向上扫，任何与"新邻居"（下/左/右）相同的方块都继续连锁。
      //    注意：不能遇到第一个匹配就 break——同一列可能有多个下移方块产生新邻居，
      //    漏掉一个就会留下同列相邻相同的非法状态（2026-08-18 v4.2 实测教训）
      for (const s of sorted){
        const col = stacks[s.col];
        for (let rr = s.row; rr < col.length; rr++){
          const v = col[rr];
          if (rr > 0 && col[rr-1] === v) queue.add(s.col + ',' + rr);
          if (s.col > 0 && stacks[s.col-1][rr] === v) queue.add(s.col + ',' + rr);
          if (s.col < COLS - 1 && stacks[s.col+1][rr] === v) queue.add(s.col + ',' + rr);
        }
      }
      // 6) 新数字弹出动画 + 合成音
      const tiles = colsEl.children[c].querySelectorAll('.stack .tile');
      const el = tiles[newRow];
      if (el){
        el.classList.add('merge-pop');
        setTimeout(() => el.classList.remove('merge-pop'), 500);
      }
      // 合成成功：等级越高音越亮，快速上行琶音（更有满足感）
      mergeSound(nl);
      await sleep(320);
    }
    if (chains === 0) return;

    combo = Math.max(combo, chains);
    // 计分：取棋盘上最大等级作为本次合成的代表等级
    let topLevel = 0;
    for (let c = 0; c < COLS; c++){
      for (const v of stacks[c]) topLevel = Math.max(topLevel, v);
    }
    const gain = Math.round(topLevel * 15 * Math.pow(1.3, chains - 1));   // 指数加成：1连1x 2连1.3x 3连1.69x 5连2.86x
    score += gain;
    updateScore();

    if (lastC < 0) lastC = 0, lastR = 0;
    const colEl = colsEl.children[lastC];
    const tiles = colEl.querySelectorAll('.stack .tile');
    const result = tiles[lastR] || null;
    spawnFX(lastC, topLevel, chains, result);

    // 连锁结束的升调音效
    if (chains > 1) beep(420 + topLevel * 45 * 1.5, 0.16, 'sine', 0.11, 0.07);

    if (chains > 1){
      comboEl.textContent = `连击 x${chains}`;
      setTimeout(() => { comboEl.textContent = ''; }, 1300);
    }

    // 连消 5 次以上：庆祝提示（弹入 → 停留 → 1.6s 自动淡出，不阻塞游戏）
    if (chains >= 5){
      const el = document.getElementById('celebration');
      const msgs = { 5: '🎉 5连击！', 6: '🔥 6连击 超棒！', 7: '⚡ 7连击 神操作！' };
      el.textContent = msgs[chains] || `💥 ${chains}连击 逆天！`;
      el.classList.remove('show');
      void el.offsetWidth;   // 强制重排，重启动画
      el.classList.add('show');
    }
  }

  async function checkGameOver(){
    let over = false;
    for (let c = 0; c < COLS; c++){
      if (stacks[c].length > overRow) { over = true; break; }
    }
    if (over){
      running = false;
      if (score > best){
        best = score;
        try { localStorage.setItem('animalBathBest', String(best)); } catch (e) { /* 忽略：无法保存最高分不影响游玩 */ }
        bestEl.textContent = best.toLocaleString();
        newBestEl.style.display = 'block';
      } else {
        newBestEl.style.display = 'none';
      }
      endScore.textContent = score.toLocaleString();
      // 结算：先提交分数到排行榜，成功后再弹窗（避免玩家刷新/关闭导致丢分）
      // 与最后的合成动画（≥500ms）并行，不额外等待
      endSubmit.style.display = 'block';
      endSubmit.className = 'submit-status';
      endSubmit.textContent = '正在提交分数…';
      const [ok] = await Promise.all([
        submitScore(),
        new Promise(r => setTimeout(r, 500))
      ]);
      endSubmit.textContent = ok ? '已计入排行榜 ✓' : '提交失败，分数未上榜';
      if (!ok) endSubmit.classList.add('fail');
      overlay.classList.add('show');
    }
  }

  // ===== 云端 / 存档 / 排行榜 =====
  function sbFetch(path, opts){
    opts = opts || {};
    // 注意：必须合并 headers，不能覆盖——POST 时传的 Prefer 会丢掉 apikey 导致 401
    const headers = Object.assign({}, SB_HEADERS, opts.headers || {});
    return fetch(SUPABASE_URL + '/rest/v1/' + path, Object.assign({}, opts, { headers: headers }));
  }

  // 本局存档（续玩）：本地立即写，云端防抖 3 秒
  function saveGame(){
    if (!nickname) return;
    const state = { stacks: stacks, score: score, combo: combo, dropCount: dropCount, nextQueue: nextQueue };
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
    if (cloudTimer) clearTimeout(cloudTimer);
    cloudTimer = setTimeout(() => {
      try {
        sbFetch('saves', {
          method: 'POST',
          headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
          body: JSON.stringify({ nickname: nickname, state: state })
        }).catch(() => {});
      } catch (e) {}
    }, 3000);
  }

  function clearSave(){
    if (cloudTimer) clearTimeout(cloudTimer);
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    if (nickname){
      sbFetch('saves?nickname=eq.' + encodeURIComponent(nickname), { method: 'DELETE' }).catch(() => {});
    }
  }

  function loadLocalSave(){
    try { return JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { return null; }
  }

  async function checkCloudSave(){
    if (!nickname) return null;
    try {
      const r = await sbFetch('saves?select=state&nickname=eq.' + encodeURIComponent(nickname) + '&limit=1');
      const rows = await r.json();
      return (Array.isArray(rows) && rows.length) ? rows[0].state : null;
    } catch (e) { return null; }
  }

  // 恢复存档
  function restoreGame(state){
    if (!state || !Array.isArray(state.stacks) || state.stacks.length !== COLS){ startNewGame(); return; }
    stacks = state.stacks.map(col => Array.isArray(col) ? col.map(Number) : []);
    score = Number(state.score) || 0;
    combo = Number(state.combo) || 0;
    dropCount = Number(state.dropCount) || 0;
    nextQueue = Array.isArray(state.nextQueue) ? state.nextQueue.map(Number) : [];
    if (nextQueue.length < 2) nextQueue = [rollLevel(), rollLevel()];
    running = true; busy = false;
    updateScore();
    render(); renderNext(); fitBoard();
    hideNameOverlay();
  }

  // 新开一局（清除旧存档）
  function startNewGame(){
    clearSave();
    init();
    hideNameOverlay();
    startBGM();   // 用户手势内启动背景音乐
  }

  // 结算：提交分数到排行榜（同名已有更高分则跳过）。返回是否成功
  async function submitScore(){
    if (!nickname || !score) return false;
    // 5 秒超时：网络差时不能让弹窗一直卡在"提交中"
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 5000);
    try {
      const r = await sbFetch('scores?select=score&nickname=eq.' + encodeURIComponent(nickname) + '&order=score.desc&limit=1', { signal: ctrl.signal });
      const rows = await r.json();
      if (Array.isArray(rows) && rows.length && rows[0].score >= score) return true;   // 已有更高分，无需重复提交
      const p = await sbFetch('scores', {
        method: 'POST',
        headers: { 'Prefer': 'return=minimal' },
        body: JSON.stringify({ nickname: nickname, score: score }),
        signal: ctrl.signal
      });
      return p.ok;
    } catch (e) {
      return false;   // 离线/失败：不影响游玩，弹窗提示未上榜
    } finally {
      clearTimeout(timer);
    }
  }

  // 拉取排行榜：同名取最高分，Top 20 + 我的排名
  async function fetchBoardList(){
    const r = await sbFetch('scores?select=nickname,score&order=score.desc&limit=200');
    const rows = await r.json();
    if (!Array.isArray(rows)) return { list: [], mine: null };
    const map = new Map();
    for (const row of rows){
      const prev = map.get(row.nickname);
      if (!prev || row.score > prev.score) map.set(row.nickname, { nickname: row.nickname, score: row.score });
    }
    const list = [...map.values()].sort((a, b) => b.score - a.score).slice(0, 20);
    let mine = null;
    if (nickname){
      const all = [...map.values()].sort((a, b) => b.score - a.score);
      const idx = all.findIndex(x => x.nickname === nickname);
      if (idx >= 0) mine = { rank: idx + 1, score: all[idx].score };
    }
    return { list: list, mine: mine };
  }

  // 展示排行榜
  async function showRank(){
    rankOverlay.classList.add('show');
    rankLoading.style.display = 'block';
    rankList.style.display = 'none';
    rankMine.style.display = 'none';
    rankList.innerHTML = '';
    try {
      const { list, mine } = await fetchBoardList();
      rankLoading.style.display = 'none';
      if (list.length === 0){
        rankList.style.display = 'block';
        rankList.innerHTML = '<div class="rank-empty">还没有成绩，快来第一个上榜 🛁</div>';
      } else {
        rankList.style.display = 'block';
        rankList.innerHTML = list.map((row, i) =>
          '<div class="rank-row' + (row.nickname === nickname ? ' me' : '') + '"><span class="rank-no">' + (i + 1) + '</span><span class="rank-name">' + escapeHtml(row.nickname) + '</span><span class="rank-score">' + row.score.toLocaleString() + '</span></div>'
        ).join('');
      }
      if (mine){
        rankMine.style.display = 'block';
        rankMine.textContent = '我的排名：第 ' + mine.rank + ' 名 · ' + mine.score.toLocaleString() + ' 分';
      }
    } catch (e){
      rankLoading.style.display = 'none';
      rankList.style.display = 'block';
      rankList.innerHTML = '<div class="rank-empty">排行榜加载失败（网络问题？）</div>';
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // ===== 昵称 =====
  function showNameOverlay(){
    nameInput.value = nickname || '';
    const hasLocal = loadLocalSave() !== null;
    if (hasLocal){
      nameContinue.style.display = 'block';
    } else {
      nameContinue.style.display = 'none';
      checkCloudSave().then(state => {
        if (state && nameOverlay.classList.contains('show')) nameContinue.style.display = 'block';
      });
    }
    nameOverlay.classList.add('show');
    setTimeout(() => { try { nameInput.focus(); } catch (e) {} }, 150);
  }

  function hideNameOverlay(){ nameOverlay.classList.remove('show'); }

  function onNameStart(){
    const name = (nameInput.value || '').trim().slice(0, 12);
    if (!name){ nameInput.focus(); return; }
    nickname = name;
    try { localStorage.setItem(NICK_KEY, nickname); } catch (e) {}
    whoNameEl.textContent = nickname;
    startNewGame();
  }

  async function onNameContinue(){
    const name = (nameInput.value || '').trim().slice(0, 12);
    if (name) nickname = name;
    try { localStorage.setItem(NICK_KEY, nickname); } catch (e) {}
    whoNameEl.textContent = nickname || '未登录';
    const local = loadLocalSave();
    const state = local || await checkCloudSave();
    if (state){
      restoreGame(state);
    } else {
      nameContinue.style.display = 'none';   // 没有可用存档
    }
  }

  // ===== 初始化 =====
  function init(){
    stacks = [];
    for (let c = 0; c < COLS; c++) stacks.push([]);
    score = 0; combo = 0; dropCount = 0;
    running = true; busy = false;
    updateScore();
    comboEl.textContent = '';
    nextQueue = [rollLevel(), rollLevel()];
    render();
    renderNext();
    overlay.classList.remove('show');
    fitBoard();
  }

  // 列背景
  for (let c = 0; c < COLS; c++){
    const bg = document.createElement('div');
    bg.className = 'col-bg';
    colsBg.appendChild(bg);
  }

  // 事件：点击列 = 投放（列上的动物也响应，相邻相同自动合成）
  colsEl.addEventListener('click', (e) => {
    const col = e.target.closest('.col');
    if (col) drop(parseInt(col.dataset.col, 10));
  });
  // 键盘 1-5 投放
  document.addEventListener('keydown', (e) => {
    if (/^[1-5]$/.test(e.key)) drop(parseInt(e.key, 10) - 1);
  });

  document.getElementById('restartBtn').addEventListener('click', startNewGame);
  document.getElementById('againBtn').addEventListener('click', startNewGame);
  document.getElementById('rankBtn').addEventListener('click', showRank);
  const muteBtn = document.getElementById('muteBtn');
  muteBtn.textContent = muted ? '🔇' : '🔊';
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    try { localStorage.setItem('animalBathMuted', muted ? '1' : '0'); } catch (e) {}
    muteBtn.textContent = muted ? '🔇' : '🔊';
    if (muted) stopBGM(); else startBGM();
    if (!muted) beep(880, 0.08, 'sine', 0.1);   // 开启时给个反馈音
  });
  // 页面隐藏时暂停 BGM（切后台不吵 + 省电），回到页面自动恢复
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopBGM();
    else if (!muted) startBGM();
  });
  document.getElementById('rankClose').addEventListener('click', () => rankOverlay.classList.remove('show'));
  document.getElementById('endRankBtn').addEventListener('click', () => { overlay.classList.remove('show'); showRank(); });
  document.getElementById('whoBtn').addEventListener('click', showNameOverlay);
  nameStart.addEventListener('click', onNameStart);
  nameContinue.addEventListener('click', onNameContinue);
  nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') onNameStart(); });
  window.addEventListener('resize', fitBoard);

  showNameOverlay();   // 启动：先登录昵称（有存档可继续上一局）
})();
</script>
</body>
</html>
