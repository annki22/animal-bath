  function onNameStart(){
    const name = (nameInput.value || '').trim().slice(0, 12);
    if (!name){ nameInput.focus(); return; }
    if (nameBusy) return;
    const needCheck = (name !== nickname);   // 名字变了（新设备起名/未锁定设备换名）→ 后台软查重；锁定设备名字恒不变直接跳过
    enterGame(name);                          // v5.8: 先秒进游戏，查重不阻塞
    if (needCheck) checkDupAsync(name);
  }

  async function onNameContinue(){
    const name = (nameInput.value || '').trim().slice(0, 12);
    if (name) nickname = name;
    try { localStorage.setItem(NICK_KEY, nickname); } catch (e) {}
    whoNameEl.textContent = nickname || '未登录';
    trackEvent('login', { action: 'continue' });   // v5.5: 输入昵称即记（续玩也算进来，不等结算上榜）
    const local = loadLocalSave();
    // v4.9: 本地存档绑昵称——同一设备换账号时，不用别人的本地存档，改查本人云端
    // （旧版存档没有 nickname 字段：同设备默认视为本人，兼容放行）
    const localMatch = local && (!local.nickname || local.nickname === nickname);
    const state = localMatch ? local : await checkCloudSave();
    if (state){
      restoreGame(state);
    } else {
      nameContinue.style.display = 'none';   // 没有可用存档
    }
  }

    nickname = '';                     // 解除设备锁定，输入框恢复可编辑
    nameInput.value = '';
    nameInput.disabled = false;
    document.getElementById('lockTip').style.display = 'none';
    nameOverlay.classList.add('show');
    try { nameInput.focus(); } catch (e) {}
  });
  window.addEventListener('resize', fitBoard);

  // v4.10.0: 道具按钮
  undoBtn.addEventListener('click', () => showPowerInfo('undo'));
  reorgBtn.addEventListener('click', () => {
    if (reorgMode){
      // v4.10.6: 整理模式中再点 = 确认整理（不再取消）——用当前框位置，没选过则默认棋盘中心 3×3
      if (reorgLeft <= 0 || busy || !running) return;
      doReorg(hoverSel || reorgFrame(Math.floor(COLS / 2), Math.floor(ROWS / 2)));
      return;
    }
    if (reorgLeft <= 0 || busy || !running) return;
    showPowerInfo('reorg');
  });
  reorgCancelBtn.addEventListener('click', () => { setReorgMode(false); });   // v4.10.6: 取消整理（不生效）
  // v5.9: 锤子按钮——进入模式（🔨 锤子）→ 再点 = 确认砸（用当前框位置，没选过则默认棋盘中心 1×1）
  hammerBtn.addEventListener('click', () => {
    if (hammerMode){
      if (hammerLeft <= 0 || busy || !running) return;
      const sel = hammerSel || { c0: Math.floor(COLS / 2), c1: Math.floor(COLS / 2), r0: Math.floor(ROWS / 2), r1: Math.floor(ROWS / 2) };
      doHammer(sel.c0, sel.r0);
      return;
    }
    if (hammerLeft <= 0 || busy || !running) return;
    showPowerInfo('hammer');
  });
  hammerCancelBtn.addEventListener('click', () => { setHammerMode(false); });   // v5.9: 取消锤子（不生效）
  document.getElementById('powerInfoCancel').addEventListener('click', closePowerInfo);
  powerInfoOverlay.addEventListener('click', (e) => { if (e.target === powerInfoOverlay) closePowerInfo(); });
  powerInfoUse.addEventListener('click', () => {
    const type = pendingPower;
    closePowerInfo();
    if (type === 'undo') { doUndo(); return; }
    if (type === 'reorg') {
      if (reorgLeft <= 0 || busy || !running) return;
      if (hammerMode) setHammerMode(false);
      setReorgMode(true);
      return;
    }
    if (type === 'hammer') {
      if (hammerLeft <= 0 || busy || !running) return;
      if (reorgMode) setReorgMode(false);
      setHammerMode(true);
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && powerInfoOverlay.classList.contains('show')) closePowerInfo();
  });
  // v5.9: 越线救场弹窗——使用道具救场 / 放弃结束
  document.getElementById('rescueGo').addEventListener('click', () => {
    rescueOverlay.classList.remove('show');
    setRescueMode(true);
  });
  document.getElementById('rescueGiveUp').addEventListener('click', () => {
    rescueOverlay.classList.remove('show');
    doGameOver(gen, 'giveup');
  });

  // v4.10.1: 整理模式框选（pointer 事件覆盖鼠标 + 触屏）
  // v4.10.4: 交互改为"固定 3×3 选择框"——框大小恒定不变（不随位置收缩成单列/小框）,
  //  电脑和手机统一：指针/手指移到哪,3×3 框就跟到哪（拖拽=移动框,不是拉矩形），点一下/松手就整理框内
  let dragStart = null;
  let hoverSel = null;   // 当前 3×3 框选区（恒 3×3，中心格 clamp 到棋盘内侧保证框完整显示）
  let suppressDrop = false;   // v5.3（攒批，安琪拍板 2026-08-20）：整理单击确认后吞掉紧随的 click，防误投
  // 固定 3×3 框：以指针格为中心，中心 clamp 到 [1,COLS-2]×[1,ROWS-2] → 框永远完整 3×3，不缩成单列/小框
  function reorgFrame(cc, rr){
    const c = Math.min(COLS - 2, Math.max(1, cc));
    const r = Math.min(ROWS - 2, Math.max(1, rr));
    return { c0: c - 1, c1: c + 1, r0: r - 1, r1: r + 1 };
  }
  // 根据指针坐标更新 3×3 框（跟随移动；指针在棋盘内就恒显示框，区域内有没有动物由执行时判断）
  function showReorgFrame(x, y){
    const sel = rectToSel(x, y, x, y);
    if (!sel){
      hoverSel = null;
      reorgRect.classList.remove('show');
      clearHoverHL();
      return;
    }
    const cc = Math.min(COLS - 1, Math.max(0, sel.c0));
    const rr = Math.min(ROWS - 1, Math.max(0, sel.r0));
    const full = reorgFrame(cc, rr);
    hoverSel = full;
    highlightHoverTile(full);
    const r = selToRect(full);
    reorgRect.style.left = r.left + 'px';
    reorgRect.style.top = r.top + 'px';
    reorgRect.style.width = r.width + 'px';
    reorgRect.style.height = r.height + 'px';
    reorgRect.classList.add('show');
  }
  board.addEventListener('pointerdown', (e) => {
    if ((!reorgMode && !hammerMode) || busy || !running) return;   // v5.9: 锤子模式同款
    if (e.button !== undefined && e.button !== 0) return;   // 仅左键
    dragStart = { x: e.clientX, y: e.clientY };
    if (reorgMode) showReorgFrame(e.clientX, e.clientY); else showHammerFrame(e.clientX, e.clientY);   // 按下立即出框（手机：手指落下就显示，滑动跟随）
    if (board.setPointerCapture) board.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  board.addEventListener('pointermove', (e) => {
    if ((!reorgMode && !hammerMode) || busy || !running) return;   // v5.9: 锤子模式同款
    if (reorgMode) showReorgFrame(e.clientX, e.clientY); else showHammerFrame(e.clientX, e.clientY);   // 按下与否都跟随——拖拽就是移动框
  });
  board.addEventListener('pointerup', (e) => {
    if (!dragStart || (!reorgMode && !hammerMode)) return;   // v5.9: 锤子模式同款
    const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
    dragStart = null;
    // v4.9.15: 松手释放指针捕获——否则后续在「确认整理」按钮上的点击事件会被重定向到棋盘,按钮收不到（"点不动"根因）
    if (board.releasePointerCapture && e.pointerId !== undefined) board.releasePointerCapture(e.pointerId);
    // v5.3（攒批，安琪拍板 2026-08-20）：电脑端"点一下即整理"——鼠标按下→抬起位移 <8px 视为单击，
    //  直接在当前 3×3 框位置确认整理生效（不用再把鼠标移出棋盘点「确认整理」按钮）；
    //  拖动（位移 ≥8px）仍走原流程：框定住，点「✓ 确认整理」按钮生效（移动端手指拖动同理，不误触）
    if (e.pointerType === 'mouse' && dx * dx + dy * dy < 64){
      if (busy || !running) return;
      suppressDrop = true;   // 吞掉紧随的 click，防止确认后立刻误投一颗
      if (reorgMode){
        if (reorgLeft <= 0) return;
        doReorg(hoverSel || reorgFrame(Math.floor(COLS / 2), Math.floor(ROWS / 2)));
      } else {
        // v5.9: 锤子——点一下棋盘即砸当前 1×1 框
        if (hammerLeft <= 0) return;
        const sel = hammerSel || { c0: Math.floor(COLS / 2), c1: Math.floor(COLS / 2), r0: Math.floor(ROWS / 2), r1: Math.floor(ROWS / 2) };
        doHammer(sel.c0, sel.r0);
      }
      return;
    }
    if (reorgMode) showReorgFrame(e.clientX, e.clientY); else showHammerFrame(e.clientX, e.clientY);   // 松手前最后跟随一次（框停在手指/指针最后位置）
    // v4.9.15: 框/高亮保留并"定住"——玩家移开手指后,框停在原地,再点「确认整理」生效（用户诉求:先框选、后确认）
  });
  board.addEventListener('pointercancel', () => {
    dragStart = null;
    // v4.9.15: 手指移开/系统中断手势不再清框——框保留在最后位置,玩家可继续点「确认整理」或 ✕ 取消
    // （原 v4.10.6 清 hoverSel+框,移动端拖动常触发 pointercancel,框一闪就没,用户反馈"框定不住"）
  });
  // v4.10.1: 鼠标离开棋盘不再清框——v4.9.15 改:鼠标移出去点「确认整理」时框必须保留（用户诉求"框选后定住"）；
  //  拖拽中移出棋盘框停最后位置,移回棋盘 pointermove 继续跟随;确认/取消由 setReorgMode 统一清理

  // 仅本地开发服务器暴露最小测试钩子，便于 CDP 验证跨局异步锁；线上域名不可用。
  if (location.hostname === '127.0.0.1' || location.hostname === 'localhost'){
    window.__animalBathTest = {
      getState: () => ({ busy, gen, running, stacks: stacks.map(col => col.slice()), undoLeft, undoDepth: undoStack.length, reorgLeft, hammerLeft, rescueMode }),
      setBusy: value => { busy = Boolean(value); },
      startNewGame,
      drop,
      doUndo,
      doReorg,
      doHammer,
      setState: state => {
        if (state.stacks) stacks = state.stacks.map(col => col.slice());
        if (state.nextQueue) nextQueue = state.nextQueue.slice();
        if (state.reorgLeft !== undefined) reorgLeft = state.reorgLeft;
        if (state.undoLeft !== undefined) undoLeft = state.undoLeft;
        if (state.hammerLeft !== undefined) hammerLeft = state.hammerLeft;
        if (state.undoStack) undoStack = state.undoStack;
        running = state.running !== undefined ? state.running : true;
        busy = Boolean(state.busy);
        updatePowerUI(); render(); renderNext(); fitBoard();
      }
    };
  }

  showNameOverlay();   // 启动：先登录昵称（有存档可继续上一局）
  flushPending();   // v5.9.16: 补报上次关闭时没发出去的埋点（弱网保底）
  trackEvent('page_view', { ua: (navigator.userAgent || '').slice(0, 120) });   // v5.4: 页面访问埋点（放最后确保 DOM 就绪）
})();
</script>
</body>
</html>
