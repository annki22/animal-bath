<!-- v6.0（2026-08-26）：皮肤重设计——Apple 极简×清透浴水×低饱和（静态视觉焕新；棋子颜色分级、合成/掉落特效与手感保持线上 v5.9.18 原版）；道具新增说明卡（首次点击先解释再确认）；登录页背景棋盘小屏适配。-->
<!-- v5.9.18（2026-08-26）：修复越线救场三个高危 bug——救场可能永久卡死（有撤回次数但无快照栈时）、救场弹窗打开时键盘仍能投子、旧局异步回调错误解锁新局；看板修复存储型 XSS 并移除明文口令。-->
<!-- v5.9.17（2026-08-25）：修复锤子砸多点后掉下来的相邻没合成（安琪反馈「列2 10和11中间那颗，砸了掉下来相邻要合成」）——根因=v5.9.15 的 doHammer 只把砸口一格 (col,row) 作 settleMerge 初始键，settleMerge 只在"发生合成后"才扫删除位置的下移链：当砸口格本身没邻居可合成时，砸口上方整段下移的同值相邻永远不会被扫到→漏合成。实测 col2=[10,5,6,11] 砸5→[10,6,11]，col3 同行 11 却不合。正解=initKeys 覆盖"砸口 + 砸口上方全部格子"（这些才因 splice 动过、是合法变化位置）；砸口下方没动的一律不传，防 v5.9.15"安静的[1,1]被误扫合成"旧坑 -->
<!-- v5.9.16（2026-08-24）：埋点弱网防丢（内测发现弱网窗口事件丢失）——evtFlush 失败不再静默丢：批放回队列头保持时序，指数退避 5s/10s/20s/40s/60s 重试（_r 上限 5 次超限才丢弃）；pagehide 兜底失败落 localStorage（animalBathPendingEvents，上限 200 条）下次打开补报成功才清；发送前 stripEvtMeta 剥离 _r/_t 内部字段防 PostgREST 整批 400。副作用：补报事件 created_at 为补报时刻非原始时刻 -->
<!-- v5.9.15（2026-08-24）：锤子砸掉后自动合成（安琪反馈「砸了之后掉下来的没自动合成」）——doHammer 砸掉一颗后，被砸列整列下移，所有新形成的相邻相同（列内砸口上下/左右列同行）自动连锁合成，与落子同规则同计分；不用全盘扫描，别处相邻大数字不受影响 -->
<!-- v5.9.14（2026-08-24）：锤子音效改清脆（安琪要求）——砸碎音从 200Hz 闷响改 1100Hz 短促方波敲击 + 700Hz 轻共鸣尾音 -->

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    background: #F5F4F0;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  .game {
    width: 100%; max-width: 420px; height: 100vh; height: 100dvh; max-height: 860px;
    background: linear-gradient(180deg, #EAF3F5 0%, #F7F4EC 40%, #F5F4F0 100%);
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }

  /* 手机端从 Safari 提供的安全布局视口顶部排版，避免地址栏切换后内容顶进状态栏。 */
  @media (max-width: 600px) {
    body { align-items: flex-start; }
  }

  /* ===== 顶部 ===== */
  .topbar {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 14px 16px 16px;   /* v5.9.3: 底部 16px = 原 4px + 已删 hint 的 12px 占位，棋盘不因删除上移 */
    position: relative;   /* v4.10.2: 道具栏悬浮定位基准 */
  }
  .title { font-size: 20px; font-weight: 800; letter-spacing: 1px; color: #2F3542; }
  .title small { display: block; font-size: 11px; font-weight: 500; color: #9AA0A8; letter-spacing: 2px; margin-top: 2px; }
  .title small em { font-style: normal; color: #FF7B93; font-weight: 700; }
  .ver { font-size: 10px; color: #B8BEC6; letter-spacing: 1px; margin-top: 6px; }
  .scorebox { position: relative; text-align: right; }
  .score-label { font-size: 10px; color: #9AA0A8; letter-spacing: 1px; }
  .score { font-size: 26px; font-weight: 800; color: #2F3542; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .best { font-size: 11px; color: #B8BEC6; margin-top: 2px; }

  /* ===== 预览区（当前动物 + 下一个） ===== */
  .next-row {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 8px 16px 6px;
  }
  .next-label { font-size: 11px; color: #9AA0A8; letter-spacing: 1px; margin-right: 2px; }
  .next-slot {
    width: 52px; height: 52px; border-radius: 14px;
    background: rgba(255,255,255,0.75);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .next-slot.current { background: #FFF6DE; box-shadow: none; }
  /* 预览区方块：独立正方形尺寸，不受棋盘 --tile 影响 */
  /* v4.9.14: 当前方块放大 78%、第二个缩小 50%——当前要落的动物一眼看清 */
  /* v4.9.14-r2: 去掉 popIn 动画——每次 renderNext 重建 tile 会重放动画导致闪烁 */
  .next-slot.current .tile {
    width: calc(var(--tile, 40px) * .78);
    height: calc(var(--tile, 40px) * .78);
    font-size: calc(var(--tile-font, 21px) * .95);
    border-radius: calc(var(--tile, 40px) * .22);
  }
  .next-slot:not(.current) .tile {
    width: calc(var(--tile, 40px) * .5);
    height: calc(var(--tile, 40px) * .5);
    font-size: calc(var(--tile-font, 21px) * .6);
    border-radius: calc(var(--tile, 40px) * .15);
    opacity: .85;
  }
  @keyframes popIn { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .cur-tag {
    position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    font-size: 9px; font-weight: 700; color: #B8860B; letter-spacing: 1px;
  }

  /* ===== 棋盘 ===== */
  .board-wrap { flex: 1; padding: 6px 12px 10px; position: relative; }
  /* 棋盘（泡泡浴缸底） */
  .board {
    position: relative; height: 100%;
    background:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,.55) 0 5px, transparent 6.5px),
      radial-gradient(circle at 78% 10%, rgba(255,255,255,.45) 0 4px, transparent 5.5px),
      radial-gradient(circle at 55% 26%, rgba(255,255,255,.35) 0 3px, transparent 4px),
      radial-gradient(circle at 30% 68%, rgba(255,255,255,.4) 0 4px, transparent 5.5px),
      radial-gradient(circle at 88% 62%, rgba(255,255,255,.3) 0 3px, transparent 4px),
      linear-gradient(180deg, #E8F6FA 0%, #D6ECF1 100%);
    border-radius: var(--radius-lg);
    border: 1px solid rgba(93,151,166,.15);
    overflow: hidden;
  }
  /* v4.9.3: 列布局从均分撑满改为收缩居中——列宽=方块宽、列间距=行间距(var(--gap))，行列视觉间距一致 */
  .cols-bg {
    position: absolute; inset: 0;
    display: flex; justify-content: center; gap: var(--gap, 2px);
    padding: 4px; box-sizing: border-box;
  }
  .col-bg {
    width: var(--tile, 40px); flex-shrink: 0;
    background: rgba(212,236,242,0.6);
    border-radius: 6px;
  }
  .col-bg:nth-child(odd) { background: rgba(190,226,235,0.65); }
  /* 警戒线 */
  .danger-line {
    position: absolute; left: 10px; right: 10px; top: 62px;
    border-top: 3px dashed #FF7B93;
    opacity: .55; pointer-events: none;
  }
  .danger-tag {
    position: absolute; right: 8px; top: 50px;
    font-size: 9px; color: #FF7B93; letter-spacing: 1px; font-weight: 600;
    pointer-events: none;
  }

  /* 棋子 */
  .tile {
    width: var(--tile, 40px); height: var(--tile, 40px);
    border-radius: calc(var(--tile, 40px) * .24);
    position: relative;
    display: flex; align-items: center; justify-content: center;
    font-size: var(--tile-font, 21px);
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,.5),
      inset 0 -4px 0 rgba(0,0,0,.10),
      0 2px 5px rgba(60,110,125,.20);
    cursor: pointer;
    transition: transform .15s;
  }
  /* 左上高光，增加立体感 */
  .tile::before {
    content: '';
    position: absolute; top: 9%; left: 12%;
    width: 30%; height: 20%;
    border-radius: 50%;
    background: rgba(255,255,255,.5);
    pointer-events: none;
  }
  .tile .animal {
    width: 62%; height: 62%; object-fit: contain;
    margin-bottom: 14%;           /* 给底部数字让位（v4.9 修复：曾误用 // 注释，吞掉了下面 pointer-events 一条） */
    pointer-events: none;
  }
  .tile .num {
    position: absolute; bottom: 4%; left: 50%; transform: translateX(-50%);
    color: #fff;
    font-size: calc(var(--tile, 40px) * .32); font-weight: 900;
    line-height: 1; letter-spacing: 0;
    text-shadow:
      0 1px 1px rgba(0,0,0,.45),
      0 0 2px rgba(0,0,0,.65),
      0 0 6px rgba(0,0,0,.35);
    pointer-events: none;
  }
  .tile.fall { animation: fallIn .26s cubic-bezier(.22,.9,.3,1); }   /* v4.9.11: 0.34s→0.26s，与落定/合成等待统一 260ms——方块落稳即合成，不再没落稳就闪 */
  @keyframes fallIn {
    0% { transform: translateY(-150px) scale(.9); opacity: .4; }
    70% { transform: translateY(0) scale(1.12, .88); opacity: 1; }
    85% { transform: translateY(0) scale(.95, 1.05); }
    100% { transform: translateY(0) scale(1); }
  }
  .tile.shake { animation: shake .3s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  .tile.merge-pop { animation: mergePop .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes mergePop {
    0% { transform: scale(.2); opacity: 0; filter: brightness(2); }
    55% { transform: scale(1.28); opacity: 1; filter: brightness(1.5); }
    75% { transform: scale(.94); filter: brightness(1.1); }
    100% { transform: scale(1); filter: brightness(1); }
  }
  /* 合成后的短暂金色光晕（v4.8 提升合成反馈） */
  .tile.merge-glow { animation: mergeGlow .7s ease-out; }
  @keyframes mergeGlow {
    0% { box-shadow: 0 0 0 rgba(255,215,94,0); }
    25% { box-shadow: 0 0 22px 6px rgba(255,215,94,.75); }
    100% { box-shadow: 0 0 0 rgba(255,215,94,0); }
  }
  /* 合成预备：两个方块碰撞闪烁 */
  .tile.merge-flash {
    animation: mergeFlash .26s ease;
    z-index: 30;
  }
  @keyframes mergeFlash {
    0% { transform: scale(1); filter: brightness(1); }
    40% { transform: scale(1.35) translateY(-4px); filter: brightness(1.8); }
    70% { transform: scale(.95); filter: brightness(1.1); }
    100% { transform: scale(1); filter: brightness(1); }
  }
  /* 合成消失：参与合成的旧方块缩小淡出 */
  .tile.merge-gone {
    animation: mergeGone .24s ease forwards;
    z-index: 30;
  }
  @keyframes mergeGone {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(.1) rotate(25deg); opacity: 0; }
  }

  /* 列（点击层） */
  .cols {
    position: absolute; inset: 0;
    display: flex; justify-content: center; gap: var(--gap, 2px);
    padding: 4px; box-sizing: border-box;
    z-index: 5;
  }
  .col {
    position: relative;
    width: var(--tile, 40px); flex-shrink: 0;   /* v4.9.3: 点击列宽=方块宽，列间距=行间距 */
    display: flex; flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: background .12s;
    border-radius: var(--radius-lg);
  }
  .col:active { background: rgba(255,255,255,0.3); }
  /* 棋子堆：从底部往上堆，栈顶在最上 */
  .col .stack {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 8px;
    display: flex; flex-direction: column-reverse;
    align-items: center; gap: var(--gap, 3px);
    pointer-events: none;
  }
  .col .stack .tile { pointer-events: auto; }
  .col .arrow {
    position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    width: 30px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    color: #7FB6C4; font-size: 14px; font-weight: 700;
    opacity: .7; pointer-events: none;
  }

  /* ===== 底部 ===== */
.bottombar {
    display: flex; flex-direction: column; align-items: stretch;
    gap: 3px; padding: 4px 12px 8px;
  }
  .bottombar .bar2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .bottombar .btn-row { display: flex; gap: 8px; flex-shrink: 0; }
  /* 更新说明（v4.9.3）：时间倒序，最新在上 */
  .upd-list { max-height: 46vh; overflow-y: auto; text-align: left; margin: 10px 0 14px; }
  .upd-item { padding: 8px 2px; border-bottom: 1px solid #EAF3F6; }
  .upd-item:last-child { border-bottom: none; }
  .upd-v { font-weight: 800; color: #FF7B93; font-size: 13px; }
  .upd-d { font-size: 10px; color: #B0BEC5; font-weight: 500; margin-left: 6px; }
  .upd-t { font-size: 12px; color: #5B6B73; line-height: 1.6; margin-top: 2px; }
  .ver { cursor: pointer; }   /* 登录页版本行可点开更新说明 */
  .combo { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; color: #D996A6; min-height: 18px; letter-spacing: 1px; font-family: "Yuanti SC", "PingFang SC", sans-serif; }
  /* 连消 5+ 的庆祝提示：弹入 → 停留 → 自动淡出（总时长 1.6s，不阻塞游戏）
     v4.10.5: 字号 32→24、颜色低饱和（#FF6B9D→#E8A3B2），告别荧光粉 */
  #celebration {
    position: absolute; top: 42%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 24px; font-weight: 800; letter-spacing: 2px;
    font-family: "Yuanti SC", "PingFang SC", sans-serif;
    color: #E8A3B2;
    text-shadow: 0 2px 14px rgba(232, 163, 178, .4);
    white-space: nowrap; pointer-events: none; z-index: 30;
    opacity: 0;
  }
  #celebration.show { animation: celebPop 1.6s ease forwards; }
  @keyframes celebPop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.5); }
    15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    30%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    72%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.06); }
  }
  .btn {
    border: none; cursor: pointer;
    font-size: 13px; font-weight: 700; letter-spacing: 1px;
    padding: 9px 10px; border-radius: 14px;
    background: #2F3542; color: #fff;
    white-space: nowrap; flex-shrink: 0;
    transition: transform .12s, opacity .2s;
  }
  .btn:active { transform: scale(.94); }
  .btn.restart { background: #E8E6E0; color: #6B7280; }
  .btn.mute-btn { width: 48px; padding: 13px 0; text-align: center; font-size: 16px; flex: none; }
  /* v4.10.1: 道具按钮（整理×1 / 撤回×2）——昵称下方竖排 */
  .btn.power { background: #E4F4F8; color: #3E7C8C; padding: 10px 14px; font-size: 13px; }
  .btn.power:disabled { opacity: .35; cursor: default; transform: none; }
  .btn.power.active { background: #FFD75E; color: #8A6D00; }
  .btn.power.cancel { background: #F3F1EB; color: #9AA0A6; }
  .btn.power .badge { font-weight: 900; margin-left: 2px; }
  /* v5.9: 道具按钮——底部横排一行（A 方案，安琪拍板 2026-08-23）。原 v4.10.2 右上角悬浮竖排（.power-col）废弃 */
  /* v5.9.1: 安琪反馈"棋盘变小了"——power-row 占文档流挤压棋盘。改回悬浮：absolute 叠在棋盘顶部内侧，不占棋盘高度（实测棋盘 305→351px、tile 39→45px） */
  /* v5.9.2: 安琪否悬浮方案"太难看了"——hint 挪到标题下，power-row 回 bottombar 文档流但按钮改小，占用原 hint 位置 */
  /* v5.9.4: 道具按钮回昵称下方悬浮竖排（安琪拍板 2026-08-23 晚：bottombar 小按钮体验差）——absolute 不占文档流，棋盘不被挤压，按钮可放大 */
  /* v5.9.5: 安琪反馈宽按钮仍压棋盘右缘——改方块图标：44×44 纯 emoji + 次数角标，x 方向完全在棋盘右侧空白区 */
  /* v5.9.12: 手机高视口棋盘被撑宽后 44px 按钮压棋盘（实测压 33px）——按钮缩到 40×40、右缘 6→2px 贴边，配合 fitBoard 预留列宽彻底不遮 */
  .power-col {
    position: absolute; top: calc(100% + 4px); right: 2px; z-index: 30;
    display: flex; flex-direction: column; gap: 6px;
  }
  .power-col .btn.power {
    flex: none; width: 40px; height: 40px; padding: 0 16px 0 0;
    font-size: 20px; display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .power-col .btn.power .badge {
    position: absolute; top: 2px; right: 2px;
    background: #FFCC00; color: #6B4F00; border-radius: 50%;
    font-size: 10px; font-weight: 700; line-height: 1;
    width: 15px; height: 15px; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .power-col .btn.power.cancel { flex: 0 0 auto; padding: 0; }
  /* 整理/锤子模式：禁投放（框选用） */
  .cols.no-pointer { pointer-events: none; }
  /* v4.10.1: 整理模式下棋盘不滚动（手机点击拖选需要 touch-action: none，否则触摸被浏览器当滚动拦截） */
  .board.selecting { touch-action: none; -webkit-user-select: none; user-select: none; }
  /* v4.10.2: 整理框选矩形 + 悬停自动框选——黄色 + 闪亮脉冲（安琪定，弃红色） */
  .reorg-rect {
    position: absolute; display: none;
    border: 2px solid #FFD75E; background: rgba(255,215,94,.14);
    border-radius: 12px; pointer-events: none; z-index: 15;
    animation: reorgPulse 1.1s ease-in-out infinite;
  }
  .reorg-rect.show { display: block; }
  @keyframes reorgPulse {
    0%, 100% { box-shadow: 0 0 3px 0 rgba(255,215,94,.35); }
    50%      { box-shadow: 0 0 14px 4px rgba(255,215,94,.75); }
  }
  /* 悬停高亮：电脑鼠标放上去自动框选（整列范围，黄色闪亮） */
  .tile.hover-hl {
    box-shadow: 0 0 0 2px rgba(255,215,94,.6), inset 0 0 0 2px rgba(255,215,94,.35);
    animation: tileGlow 1.1s ease-in-out infinite;
  }
  @keyframes tileGlow {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(1.25); }
  }

  /* ===== 特效层 ===== */
  .fx-layer { position: absolute; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
  .float-text {
    position: absolute; font-weight: 700; color: #D996A6;
    font-size: 12px; animation: floatUp 1s ease forwards;
    text-shadow: 0 1px 0 rgba(255,255,255,.8);
    white-space: nowrap;
  }
  @keyframes floatUp {
    0% { transform: translateY(0); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(-70px); opacity: 0; }
  }
  .particle {
    position: absolute; border-radius: 50%;
    animation: burst .7s ease-out forwards;
  }
  @keyframes burst {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; }
  }
  /* v4.10.5: 泡泡装饰——纯 CSS 绘制（不用 🫧 emoji：Unicode 14.0，旧安卓会显示豆腐块），
     半透明圆 + 高光点 + 细描边，随合并飘字缓缓升起，沐浴主题 */
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, rgba(255,255,255,.95), rgba(255,255,255,.18) 45%, rgba(255,255,255,.05));
    border: 1px solid rgba(255,255,255,.65);
    box-shadow: none;
    pointer-events: none;
    animation: bubbleUp 1.1s ease-out forwards;
  }
  @keyframes bubbleUp {
    0%   { transform: translateY(4px) scale(.35); opacity: 0; }
    25%  { opacity: .9; }
    100% { transform: translateY(-52px) scale(1.2); opacity: 0; }
  }

  /* ===== 结束遮罩 ===== */
  .overlay {
    position: absolute; inset: 0; z-index: 40;
    background: rgba(25,30,32,.20);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 160ms ease-out;
  }
  .overlay.show { opacity: 1; pointer-events: auto; transition-duration: 220ms; }
  .modal {
    background: rgba(255,255,255,.94);
    border: 1px solid rgba(31,35,38,.07);
    border-radius: 22px;
    padding: 28px 32px; text-align: center;
    opacity: 0; transform: translateY(8px) scale(.985);
    transition: opacity 160ms ease-out, transform 160ms ease-out;
    width: 78%; max-width: 300px;
  }
  .overlay.show .modal {
    opacity: 1; transform: translateY(0) scale(1);
    transition-duration: 220ms;
  }
  @supports ((backdrop-filter: blur(18px)) or (-webkit-backdrop-filter: blur(18px))) {
    .modal {
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }
  }
  .modal .emoji { font-size: 52px; margin-bottom: 8px; }
  .modal h2 { font-size: 22px; font-weight: 800; color: #2F3542; margin-bottom: 4px; }
  .modal .sub { font-size: 13px; color: #9AA0A8; margin-bottom: 16px; }
  .modal .btn { width: 100%; padding: 13px; font-size: 15px; border-radius: 16px; }
  .btn.ghost { background: #E8E6E0; color: #6B7280; margin-top: 8px; }
  /* 道具说明卡：复用全局遮罩，不改动道具栏几何 */
  .power-modal { position: relative; overflow: hidden; }
  .power-modal::before, .power-modal::after {
    content: ''; position: absolute; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 30% 28%, rgba(255,255,255,.95), rgba(165,220,232,.18) 48%, rgba(165,220,232,.05));
    border: 1px solid rgba(137,203,216,.24);
  }
  .power-modal::before { width: 62px; height: 62px; top: -24px; right: -18px; }
  .power-modal::after { width: 30px; height: 30px; left: -9px; bottom: 54px; }
  .power-modal .emoji { width: 64px; height: 64px; margin: 0 auto 10px; border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; font-size: 34px; background: linear-gradient(145deg, #FFF8DA, #FFE7A2); box-shadow: none; }
  .power-modal .power-count { display: inline-flex; align-items: center; gap: 5px; margin: 0 0 17px; padding: 5px 10px; border-radius: 999px; color: #7A6670; background: #FFF0F5; font-size: 12px; font-weight: 750; }
  .power-modal .power-count b { color: #E65F8D; font-size: 14px; font-variant-numeric: tabular-nums; }
  .power-actions { display: flex; gap: 8px; }
  .power-actions .btn { margin: 0; }
  .power-actions .ghost { flex: .78; }
  .power-actions .power-use { flex: 1.22; background: linear-gradient(145deg, #FF7FA8, #F05F91); box-shadow: none; }
  /* v5.9: 越线救场弹窗——剩余道具清单 */
  .rescue-powers { font-size: 13px; font-weight: 700; color: #3E7C8C; margin: -6px 0 14px; line-height: 1.8; }

  /* ===== 昵称 & 排行榜 ===== */
  .who { font-size: 11px; color: #7FB6C4; margin-top: 3px; cursor: pointer; font-weight: 600; }
  .name-input {
    width: 100%; padding: 12px 14px; margin-bottom: 12px;
    font-size: 15px; font-weight: 600; text-align: center;
    border: 1px solid var(--border); border-radius: var(--radius-md); outline: none;
    background: #F8F7F4; color: #2F3542;
  }
  .name-input:focus { border-color: #7FB6C4; background: #fff; }
  .name-input:disabled { color: #9AA0A8; background: #F0EFEA; border-color: #E8E6E0; cursor: not-allowed; }
  .lock-tip { font-size: 11px; color: #9AA0A8; margin: -6px 0 10px; }
  
  .rank-list { max-height: 300px; overflow-y: auto; text-align: left; margin: 6px 0 10px; -webkit-overflow-scrolling: touch; }
  .rank-row { display: flex; align-items: center; padding: 8px 6px; border-bottom: 1px solid #F0EFEA; font-size: 14px; }
  .rank-row:last-child { border-bottom: none; }
  .rank-row.me { background: #FFF6DE; border-radius: 10px; }
  .rank-no { width: 46px; font-weight: 800; color: #9AA0A8; font-variant-numeric: tabular-nums; }
  .rank-row:nth-child(1) .rank-no { color: #F0B62E; }
  .rank-row:nth-child(2) .rank-no { color: #B8BEC6; }
  .rank-row:nth-child(3) .rank-no { color: #C88F5A; }
  .rank-name { flex: 1; font-weight: 600; color: #2F3542; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-score { font-weight: 800; color: #2F3542; font-variant-numeric: tabular-nums; }
  .rank-max { font-size: 13px; font-weight: 800; color: #F08C2E; margin-left: 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rank-empty { color: #9AA0A8; font-size: 13px; padding: 20px 0; }
  .rank-summary { padding: 8px 0 14px; border-bottom: 1px solid #F0EFEA; margin-bottom: 10px; }
  .rank-summary .rs-emoji { font-size: 44px; line-height: 1.15; }
  .rank-summary .rs-level { font-size: 14px; font-weight: 800; color: #2F3542; margin-top: 5px; }
  .rank-summary .rs-level b { font-size: 26px; color: #F08C2E; font-weight: 800; font-variant-numeric: tabular-nums; }
  .rank-mine { font-size: 12px; color: #9AA0A8; margin-bottom: 10px; }
  .rank-loading { color: #9AA0A8; font-size: 13px; padding: 24px 0; }

  /* ===== 静态视觉皮肤：Apple 极简 × 清透浴水 × 低饱和 ===== */
  :root {
    --bg-page: #F5F6F7;
    --surface: #FFFFFF;
    --surface-secondary: #F0F2F4;
    --water-100: #EAF5F8;
    --water-200: #DDEFF4;
    --water-300: #C8E4EB;
    --water-500: #70AEBE;
    --water-700: #447986;
    --text-primary: #202326;
    --text-secondary: #686E73;
    --text-tertiary: #989EA3;
    --warning: #D99AA5;
    --warning-text: #B97884;
    --warning-bg: #FAECEF;
    --border: rgba(31,35,38,.08);
    --border-water: rgba(93,151,166,.16);
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 22px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", sans-serif;
    background: var(--bg-page);
    color: var(--text-primary);
  }
  .game { background: var(--bg-page); }

  /* 标题与分数层级 */
  .title {
    color: var(--text-primary);
    font-size: 22px;
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: -.4px;
  }
  .title small {
    margin-top: 4px;
    color: var(--text-tertiary);
    font-size: 10px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: .5px;
  }
  .title small em { color: inherit; font-weight: inherit; }
  .score-label {
    color: var(--text-tertiary);
    font-size: 10px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: .2px;
  }

  function getAnimal(level){
    return ANIMALS[level - 1] || '🐾';
  }

  // 新动物生成：从小到大，大数字只靠合成（v4.9.13 回归主流掉落设计）
  //  · 开局掉 1-5，重心 3.4（v4.2）；25 投后 6 常驻 + 7 稀有点缀（4%）；权重重心随进度 3.4→4.2，1 级低频（原游戏实测 1 占比仅 ~11%）
  //  · 8 级以上永不掉落，只能靠合成——7 是 8+ 合成链的掉落燃料（6+6+6 或 7+7 才能出 8）
  //  · 1、2 后期保底：1 压到 8%、2 压到 5%（v4.9.15，原 v4.9.10 压到 2% 导致后期断供、玩家干等 1）
  //  · 合成无上限：8/9/10/11/12... 全由棋盘合成产出
  let dropCount = 0;         // 已投放次数（难度进度）

  // v4.9.15（攒批）：掉落数字逻辑 = v4.9.13 原版 + 1/2 后期保底（安琪拍板 2026-08-20，朋友反馈后期等 1 卡死）
  //  · 原版：8+ 永不掉落、只靠合成；7 稀有燃料（25 投后解锁、锚定 4%）；3-6 高斯主力
  //  · 1/2 后期保底：1 压到 8%、2 压到 5%（不再压到 2%——1 是唯一不可合成的数字，断供=整条合成链卡死）
  //  · 删 v4.9.14-r7 大数字让位 / r9 让位前先配对（棋盘感知被否，回纯概率）
  function rollLevel(){
    // v4.9.15（攒批）：纯概率回归（v4.9.13 框架）——删 r7 让位/r9 补配对（棋盘感知被否，安琪拍板 2026-08-20）
    // 1/2 后期保底：1: 11%→8%、2: 25%→5%——1 是唯一不可合成的数字（1+1→2 是合成链起点），后期断供=玩家干等
    const d = Math.min(1, dropCount / 100);   // 进度 0→1（100 投到顶）
    const maxMid = dropCount >= 25 ? 6 : 5;   // v4.2 节奏：开局 25 投内只掉 1-5，之后 6 常驻
    const center = 3.4 + d * 0.8;             // 重心 3.4 → 4.2
    const sigma = 1.15 + d * 0.3;             // 后期分布略宽
    let p1T = 0.11 + (0.08 - 0.11) * d;   // 11% → 8%（保底）
    let p2T = 0.25 + (0.05 - 0.25) * d;   // 25% → 5%（保底；2 可由 1+1 合成，需求低于 1）
    const w = [0, 0];   // 1、2 权重占位（乘 anchor 后精确占比）
    const lv = [1, 2];  // 权重对应等级（7 可能跳过，不能用下标反推等级）
    let s36 = 0;
    for (let i = 3; i <= maxMid; i++){
      const dist = Math.abs(i - center);
      let weight = Math.exp(-(dist * dist) / (2 * sigma * sigma));
      if (i === 3) weight += 0.45;   // 保底：3 保持一定频率（合成的基础，保证游戏可持续）
      weight = Math.max(weight, 0.05);   // 兜底 0.05
      w.push(weight); lv.push(i);
      s36 += weight;
    }
    const p7 = dropCount >= 25 ? 0.04 : 0;   // 7 保留为稀有燃料，25 投后解锁、锚定 4%
    // 锚定法统一：被锚定档权重 = p·s/(1-Σp)，任何进度下被锚档占比精确等于目标
    const anchor = s36 / (1 - p1T - p2T - p7);
    w[0] = p1T * anchor;
    w[1] = p2T * anchor;
    if (p7 > 0){ w.push(p7 * anchor); lv.push(7); }
    const total = w.reduce((a,b)=>a+b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < w.length; i++){
      r -= w[i];
      if (r <= 0) return lv[i];
    }
    return lv[w.length - 1] || 3;
  }

  // ===== 音效（Web Audio 轻量合成） =====
  let actx = null;
  let muted = false;   // 全局静音：只关音效（localStorage 持久化）
  try { muted = localStorage.getItem('animalBathMuted') === '1'; } catch (e) {}
  function beep(freq, dur, type, vol, when){
    if (muted) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const t = actx.currentTime + (when || 0);
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.1));
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + (dur || 0.1) + 0.03);
    } catch(e){}
  }

  function mergeSound(nl){
    if (muted) return;
    const base = 360 + nl * 42;
    beep(base, 0.09, 'square', 0.07);
    beep(base * 1.26, 0.10, 'triangle', 0.10, 0.06);

  // ===== 渲染 =====
  function tileHTML(level, extra=''){
    // v4.5: 动物用内嵌 base64 图片（Mac 预渲染），任何设备渲染一致；
    // 超过 40 级（理论上不可达）回退 emoji 文本
    const face = EMOJI_IMGS[level]
      ? `<img class="animal" src="${EMOJI_IMGS[level]}" alt="">`
      : getAnimal(level);
    return `<div class="tile ${extra}" data-level="${level}" style="background:${getGrad(level)}">${face}<span class="num">${level}</span></div>`;
  }

  function render(){
    colsEl.innerHTML = '';
    for (let c = 0; c < COLS; c++){
      const col = document.createElement('div');
      col.className = 'col';
      col.dataset.col = c;
      const arrow = document.createElement('div');
      arrow.className = 'arrow';
      arrow.textContent = '▼';
      const stack = document.createElement('div');
      stack.className = 'stack';
      // 从底到顶渲染（DOM顺序=栈底→栈顶，column-reverse 让栈底在视觉底部）
      for (let i = 0; i < stacks[c].length; i++){
        const d = document.createElement('div');
        d.innerHTML = tileHTML(stacks[c][i]);
        stack.appendChild(d.firstChild);
      }
      col.appendChild(arrow);
      col.appendChild(stack);
      colsEl.appendChild(col);
    }
  }

  function fitBoard(){
    const boardH = board.clientHeight;
    // v4.9.8: 可用宽度从父容器取（.board-wrap padding 12px*2）——本函数会给 board 设显式收窄宽度，读 board 自身会反馈收缩
    const availW = board.parentElement.clientWidth - 24;
    if (!boardH || !availW) return;
    const gap = 2;
    // v5.9.12: 右侧道具按钮列预留空间（按钮 40px + 右缘 2px + 间隙 8px + 余量 6px）——
    // 手机高视口下 byHeight 很大、byWidth 主导会把棋盘撑满屏宽（360×800 实测 tile 63、棋盘 325px 占 90% 屏宽），
    // 右侧 44px 按钮列被挤出容器、压进棋盘右缘（实测压 33px）。预留后窄屏棋盘回落到基线 tile 50；
    // 宽屏 byWidth 本就远超 byHeight（tile 由高度决定），预留不影响桌面棋盘尺寸
    const POWER_RESERVE = 56;
    // v4.9.1: 固定 6 行堆叠区——方块尺寸取"列宽"与"6 行恰好放下"的较小者，
    // 大屏不再出现警戒线上移/行数变多（电脑、手机一致 6 行）；矮屏自动缩小方块保证 6 行放得下
    const byWidth = Math.max(34, Math.floor((availW - 10 - (COLS - 1) * gap - POWER_RESERVE) / COLS));   // v4.9.3: 列收缩居中布局，净列距=gap
    // v4.9.2: 高度预算按 7 行算（线下 6 行堆叠 + 线上 1 行投放缓冲）——警戒线上方始终留出一行空间
    const byHeight = Math.max(24, Math.floor((boardH - 14 - ROWS * gap) / (ROWS + 1)));
    const tile = Math.min(byWidth, byHeight);
    rootStyle.setProperty('--tile', tile + 'px');
    rootStyle.setProperty('--gap', gap + 'px');
    rootStyle.setProperty('--tile-font', Math.round(tile * 0.5) + 'px');
    // v4.9.8: 五列保持紧挨（列距=行距 gap），浴缸宽度收窄到刚好包住五列——两边留白从浴缸内删掉（推翻 v4.9.7 横向铺满）
    board.style.width = (COLS * tile + (COLS - 1) * gap + 8) + 'px';   // 8 = cols 层 padding 4px*2
    board.style.margin = '0 auto';
    curTile = tile; curGap = gap;
    // 警戒线 = 第 6 行顶部（堆满 6 层顶部贴线=触碰，不死；第 7 层越线=结束）
    const top = Math.max(6, boardH - 7 - ROWS * (tile + gap));
    dangerLine.style.top = top + 'px';
    dangerTag.style.top = (top - 12) + 'px';
  }

  // ===== 特效 =====
  function spawnFX(colIdx, level, chain, targetEl){
    const boardRect = board.getBoundingClientRect();
    let cx, y;
    if (targetEl){
      const r = targetEl.getBoundingClientRect();
      cx = r.left - boardRect.left + r.width / 2;
      y = r.top - boardRect.top + r.height / 2;
    } else {
      // v4.9.8: 浴缸收窄包住五列——列距=curGap，按实际列几何算中心
      const innerW = boardRect.width - 8;   // cols 层 padding 4px * 2
      const totalW = COLS * curTile + (COLS - 1) * curGap;
      const startX = 4 + Math.max(0, (innerW - totalW) / 2);
      cx = startX + colIdx * (curTile + curGap) + curTile / 2;
      y = 200;
    }

    // 浮动文字（v4.10.5: 字号调小、emoji 用 💦/✨——Unicode 6.0，安卓 7+ 全支持）
    const gain = Math.round(level * 18 * Math.pow(1.5, chain - 1));   // v4.9.14: 与主计分同步（基础 18、指数 1.5）
    const ft = document.createElement('div');
    ft.className = 'float-text';
    ft.textContent = chain > 1 ? `✨ 连击 ×${chain} · 洗浴值 +${gain}` : `💦 洗浴值 +${gain}`;
    ft.style.left = (cx - 50) + 'px';
    ft.style.top = y + 'px';
    fx.appendChild(ft);

    // v4.10.5: 泡泡装饰——纯 CSS 小泡泡从合成点升起（不依赖 🫧 emoji 兼容性）
    const bCount = 3 + (chain > 1 ? 1 : 0);
    for (let i = 0; i < bCount; i++){
      const b = document.createElement('div');
      b.className = 'bubble';
      const bs = 6 + Math.random() * 10;
      b.style.width = b.style.height = bs + 'px';
      b.style.left = (cx + (Math.random() - .5) * 70) + 'px';
      b.style.top = (y + 6 + Math.random() * 14) + 'px';
      b.style.animationDelay = (Math.random() * .25) + 's';
      fx.appendChild(b);
    }

    // 粒子（v4.8: 连击越多粒子越多，合成反馈更爽；v4.10.5: 粉粒子低饱和）
    const colors = ['#E8A3B2','#FFD75E','#7ED6A5','#8FC7FF'];
    const pCount = Math.min(16, 8 + (chain - 1) * 2);
    for (let i = 0; i < pCount; i++){
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = cx + 'px';
      p.style.top = y + 'px';
      p.style.width = p.style.height = (4 + Math.random()*6) + 'px';
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      const ang = Math.random() * Math.PI * 2;
      const dist = 30 + Math.random() * 40;
      p.style.setProperty('--dx', Math.cos(ang)*dist + 'px');
      p.style.setProperty('--dy', Math.sin(ang)*dist + 'px');
      fx.appendChild(p);
    }
    setTimeout(() => {
      ft.remove();
      fx.querySelectorAll('.particle, .bubble').forEach(p => p.remove());
    }, 1100);
  }

  // ===== 道具（v4.10.0）：撤回 & 整理 =====
  // 撤回 = 快照栈。每次"会改变棋盘"的操作（落子）执行前压栈；撤回时弹栈恢复。
  // v4.9.15（攒批，安琪拍板）：整理生效 = 清空撤销栈（不可逆分界线）——整理前的落子不再可撤回，
  //  自然杜绝"整理→撤回→再整理"白嫖整理次数；撤回次数本身保留（整理后新落子照常可撤）。
  //  撤回次数不退还（一次消耗品，否则等于无限撤回）；快照不存 undoLeft。
  const UNDO_MAX = 8;   // 栈上限：撤回次数只有 2，只留最近几步就够，防内存膨胀

  function canUseUndo(){
    return undoLeft > 0 && undoStack.length > 0;
  }

  function canRescue(){
    return reorgLeft > 0 || hammerLeft > 0 || canUseUndo();
  }

  function pushUndo(){
    undoStack.push({
      stacks: stacks.map(col => col.slice()),
      score: score,
      dropCount: dropCount,
      nextQueue: nextQueue.slice(),
      maxLevel: maxLevel,
      reorgLeft: reorgLeft,
      hammerLeft: hammerLeft   // v5.9: 快照含锤子次数；v5.9.13: 锤子后清栈不可逆，此字段仅随锤子后的新落子快照保留（撤回时恢复的是锤子后状态）
    });
    if (undoStack.length > UNDO_MAX) undoStack.shift();   // 只保留最近几步
  }

  function doUndo(){
    if (!running || busy) return;
    if (reorgMode || hammerMode) return;   // 整理/锤子模式中禁撤回（先取消框选）
    if (!canUseUndo()){ beep(150, 0.15, 'square', 0.08); rescueCheck(); return; }   // 无次数/无快照：低音提示；救场中重新给出放弃出口
    const s = undoStack.pop();
    stacks = s.stacks;
    score = s.score;
    dropCount = s.dropCount;
    nextQueue = s.nextQueue;
    maxLevel = s.maxLevel;
    reorgLeft = s.reorgLeft;       // 退还整理次数（撤回整理 = 没整理）
    hammerLeft = (s.hammerLeft !== undefined) ? s.hammerLeft : hammerLeft;   // v5.9: 快照含锤子次数（旧快照防御）；v5.9.13: 锤子不可逆后，此恢复仅作用于锤子之后的新落子快照（值即当前剩余次数）
    undoLeft--;                    // 撤回本身消耗一次
    updateScore(); render(); renderNext(); fitBoard();
    updatePowerUI();
    saveGame();                    // 撤回也是状态变更，立刻存档
    trackEvent('power_use', { type: 'undo', left: undoLeft });   // v5.4: 道具埋点
    rescueCheck();                 // v5.9: 救场模式中撤回后检查是否解除越线
    beep(300, 0.14, 'sine', 0.10); // 撤回音（低柔上行）
  }

  function updatePowerUI(){
    // 注意：整理模式中 reorgBtn 不能 disabled——玩家要再点一次来取消整理
    // v4.10.3: 去掉 busy 置灰——原来每次落子/合成按钮灰一下又亮（动画期间 disabled 反复切换），视觉上就是闪烁；
    //  现在按钮外观保持稳定，下落/合成期间点击由各 handler 内的 busy 检查直接拦截（点了没反应，不闪）
    reorgBtn.disabled = (reorgLeft <= 0);
    undoBtn.disabled = (undoLeft <= 0) || !undoStack.length || reorgMode || hammerMode;   // v4.9.15: 整理不再禁用撤回（栈已清,整理后新落子照常可撤）；v5.9: 锤子模式中同样禁撤回
    hammerBtn.disabled = (hammerLeft <= 0);   // v5.9
    reorgLeftEl.textContent = reorgLeft;
    undoLeftEl.textContent = undoLeft;
    hammerLeftEl.textContent = hammerLeft;   // v5.9
    reorgBtn.classList.toggle('active', reorgMode);
    hammerBtn.classList.toggle('active', hammerMode);   // v5.9
    // v4.10.6: 按钮文字统一由 setReorgMode 管理（v5.9.6: 改纯图标，进入模式 = "✓"，确认制）；此处保持同步防止 updatePowerUI 后调用时覆盖回旧文字
    if (reorgBtn.firstChild) reorgBtn.firstChild.textContent = reorgMode ? '✓' : '🧹';
    // v5.9: 锤子同款（v5.9.6: 改纯图标，进入模式 = "✓"）
    if (hammerBtn.firstChild) hammerBtn.firstChild.textContent = hammerMode ? '✓' : '🔨';
  }

  // ===== 整理（v4.10.1）：框选区域 → 区域棋子按大小重排 → 相邻相同自动连锁合成 =====
  // 规则（对齐既有合成语义，v4.10.1 安琪定：大的沉底、小的浮上——泡澡物理直觉）：
  //  · 区域内棋子全部取出，按等级降序排序（大在下、小在上），再按列容量回填——列高不变，绝不越线
  //  · 排序后同值棋子上下/左右相邻 → 触发全盘扫描连锁合成（吸收 k 个 → 跳 k 级，同 settleMerge）
  //  · 合成计分与普通合成同一套公式（topLevel × 18 × 1.5^(chains-1)）
  // 交互（v4.10.1 安琪定 → v4.10.5 改 → v4.10.6 确认制 → v5.3 攒批改）：进入整理模式后，固定 3×3 黄框跟随指针/手指移动
  //  （框大小恒定不变，不随位置收缩成单列/小框），电脑端鼠标移到目标位置后**点一下棋盘即整理生效**（v5.3 安琪定：
  //  原来必须移出棋盘点「确认整理」按钮，框跟鼠标走没法同时点按钮，操作别扭）；拖动松手仍可点按钮确认；
  //  移动端手指拖动框 → 松手定住 → 点「确认整理」生效；点 ✕ 取消退出

  function setReorgMode(on){
    reorgMode = on;
    reorgSel = null;
    reorgRect.classList.remove('show');
    clearHoverHL();
    syncBoardLock();   // v5.9: 统一棋盘锁（整理/锤子/救场任一开启即禁投放），原 colsEl.classList.toggle('no-pointer')
    // v4.10.6: 进入模式后整理按钮变"确认"（badge 保留不重建，reorgLeftEl 引用不失效），并显示取消按钮；v5.9.6: 改纯图标 ✓
    const tn = reorgBtn.firstChild;   // 文本节点（badge span 是第二个子节点）
    if (tn) tn.nodeValue = on ? '✓' : '🧹';
    reorgBtn.title = on ? '把 3×3 黄框移到想整理的位置：电脑端点一下棋盘即生效，或点这里确认；点 ✕ 取消' : '清场整理：点一下进入，3×3 黄框跟随鼠标/手指移动（大小固定不变），把框移到想整理的位置——电脑端点一下棋盘即生效，或点「确认整理」；点 ✕ 取消退出';
    reorgCancelBtn.style.display = on ? '' : 'none';
    updatePowerUI();
  }

  // ===== 锤子（v5.9）：1×1 框选单格，砸掉一颗棋子 =====
  // 规则（安琪拍板 2026-08-23）：框就是 1×1，只能砸一颗；初始 1 次；交互与整理同款——点锤子 → 1×1 黄框跟随
  //  鼠标/手指 → 电脑端点一下棋盘即砸（或点「🔨 确认砸」按钮）→ 砸掉那一颗 → 次数 -1；点 ✕ 取消退出。
  //  · 砸掉后上方棋子自然下落，不触发合成；可被撤回（快照含次数，撤回后次数一并退还）
  //  · 救场模式中可用（超线时砸掉越线棋子 = 最直接的解法）
  function setHammerMode(on){
    hammerMode = on;
    hammerSel = null;
    hammerRect.classList.remove('show');
    clearHoverHL();
    syncBoardLock();
    const tn = hammerBtn.firstChild;   // 文本节点（badge span 是第二个子节点）
    if (tn) tn.nodeValue = on ? '✓' : '🔨';
    hammerBtn.title = on ? '把 1×1 黄框移到想砸的棋子上：电脑端点一下棋盘即砸，或点这里确认；点 ✕ 取消' : '砸掉一颗棋子：点一下进入，1×1 黄框跟随鼠标/手指移动，框住想砸的棋子——电脑端点一下即砸，或点「确认砸」；点 ✕ 取消退出';
    hammerCancelBtn.style.display = on ? '' : 'none';
    updatePowerUI();
  }

  // 指针坐标 → 1×1 框（单格；列号 clamp 到棋盘内，行号按实际列高 clamp——越线时第 7 层（row 6）也要能选中，
  //  不能像 3×3 那样 clamp 到 ROWS-1（v5.9 实测：clamp 到 5 导致锤子永远砸到越线层下面那颗））
  function showHammerFrame(x, y){
    const sel = rectToSel(x, y, x, y);
    if (!sel){
      hammerSel = null;
      hammerRect.classList.remove('show');
      clearHoverHL();
      return;
    }
    const cc = Math.min(COLS - 1, Math.max(0, sel.c0));
    const colEl = colsEl.children[cc];
    const maxR = Math.max(0, colEl.querySelectorAll('.stack .tile').length - 1);   // 实际列高-1（空列=0，无棋子由 doHammer 防御）
    const rr = Math.min(maxR, Math.max(0, sel.r0));
    const one = { c0: cc, c1: cc, r0: rr, r1: rr };
    hammerSel = one;
    highlightHoverTile(one);
    const r = selToRect(one);
    hammerRect.style.left = r.left + 'px';
    hammerRect.style.top = r.top + 'px';
    hammerRect.style.width = r.width + 'px';
    hammerRect.style.height = r.height + 'px';
    hammerRect.classList.add('show');
  }

  // 砸碎反馈：粒子迸溅 + 闷响（在 render 前对旧 DOM 播放）
  function hammerFX(colIdx, row, level){
    const colEl = colsEl.children[colIdx];
    const tiles = colEl.querySelectorAll('.stack .tile');
    const el = tiles[row];
    if (el){
      const rect = el.getBoundingClientRect();
      const br = board.getBoundingClientRect();
      const cx = rect.left + rect.width / 2 - br.left;
      const cy = rect.top + rect.height / 2 - br.top;
      for (let i = 0; i < 8; i++){
        const p = document.createElement('div');
        p.className = 'particle';
        const ang = Math.random() * Math.PI * 2;
        const dist = 16 + Math.random() * 22;
        p.style.cssText = `left:${cx.toFixed(1)}px;top:${cy.toFixed(1)}px;width:${(5 + Math.random() * 6).toFixed(1)}px;height:${(5 + Math.random() * 6).toFixed(1)}px;background:${getGrad(level)};--dx:${(Math.cos(ang) * dist).toFixed(1)}px;--dy:${(Math.sin(ang) * dist).toFixed(1)}px;`;
        fx.appendChild(p);
        setTimeout(() => p.remove(), 750);
      }
    }
    beep(1100, 0.07, 'square', 0.12);   // v5.9.14 砸碎清脆敲击（原 200Hz 闷响，安琪要求清脆：高频短促方波）
    beep(700, 0.06, 'triangle', 0.10, 0.02);   // 轻共鸣尾音，敲击感更立体
  }

  // 砸掉一颗棋子（col, row 为行号，0 = 底部）
  // v5.9.15: 改为 async——砸掉后上方棋子下落，下落形成的新相邻相同自动合成（安琪反馈「砸了之后掉下来的没自动合成」）
  async function doHammer(col, row){
    if (!running || busy) return;
    if (hammerLeft <= 0) return;
    const s = stacks[col];
    if (!s || row >= s.length){ beep(150, 0.15, 'square', 0.08); rescueCheck(); return; }   // 框住的格子没有棋子：救场中重新给出放弃出口
    const lv = s[row];
    // v5.9.13: 锤子改为不可逆道具（安琪拍板：用完锤子后禁撤回）——清空撤销栈，锤子前的落子不可再撤回
    //（防"砸完→撤回→重砸"白嫖；锤子砸掉后连锁下落/合成的结果不可反悔）；锤子之后的新落子照常可撤
    undoStack = [];
    hammerFX(col, row, lv);        // 先播砸碎特效（DOM 未刷新）
    stacks[col].splice(row, 1);    // 砸掉该棋子，上方棋子自然下落
    hammerLeft--;
    setHammerMode(false);
    busy = true;                   // v5.9.15: 下落合成期间锁操作（防连锁途中点投/道具）
    updateScore(); render(); fitBoard();
    updatePowerUI();
    trackEvent('power_use', { type: 'hammer', left: hammerLeft });   // v5.4: 道具埋点
    // v5.9.15: 砸掉后自动合成——只从砸口位置 (col, row) 触发（砸掉后落到此处的棋子与四周的新相邻：
    // 下方=砸口另一侧、上方=落下的原棋子、左右=同层新邻居），后续连锁由 settleMerge 的下移链扫描自动传播。
    // ⚠️ 不能把全列都作起点（实测 v5.9.15 初版）：会把"本来就没动过的相邻"（如安静的 [1,1]）也扫出来合成，
    // 违反"合成只发生在变化/掉落位置附近"的核心规则
    // v5.9.17: fix 锤子下落合成漏检——initKeys 不能只传砸口一格。
    // 砸掉后，砸口位置被原上方棋子补位，且砸口上方的所有棋子整体下移一格，
    // 它们的新位置都可能与左右列同行产生新相邻（合成），但 settleMerge 只在
    // "发生了合成"后才扫删除位置的下移链——若砸口格本身不合成，链永远不被扫，
    // 上方下移的同值相邻就会漏合成（实测：col2=[10,5,6,11] 砸5 → [10,6,11]，col3
    // 同行 11 却不合）。正解=initKeys 覆盖"砸口 + 砸口上方全部格子"（这些才因 splice
    // 动过，是合法变化位置）；砸口下方没动的绝不传（防把安静的 [1,1] 误合成，v5.9.15 旧坑）。
    const stack = stacks[col];
    const myGen = gen;
    const initKeys = new Set();
    for (let rr = row; rr < stack.length; rr++) initKeys.add(col + ',' + rr);
    setTimeout(async () => {
      try {
        await settleMerge(col, myGen, initKeys);
      } catch (e) {
        console.error('hammer settleMerge error:', e);
        render();  // 异常时兜底：重建棋盘，避免状态错乱
      } finally {
        if (myGen !== gen) return;   // 局已换：checkGameOver/saveGame 都归新局管
        busy = false;
        updatePowerUI();
        if (rescueMode) rescueCheck();   // v5.9: 救场中砸完（含合成落定后）检查是否解除越线
        else checkGameOver();
        if (running) saveGame();   // 合成结果落定后存档
      }
    }, 300);   // 等碎裂特效粒子基本播完再开始合成，视觉不打架（particle 750ms 移除）
  }

  // ===== 越线救场（v5.9）：超线不再直接结束 =====
  // 规则（安琪拍板 2026-08-23）：越线 → 弹确认框（剩余道具清单）→「使用道具救场」进入救场模式（禁投子、
  //  道具可用）→ 每次用道具后复查：超线解除（列回 6 层内）则正常继续；未解除且还有道具则继续救；
  //  道具用尽没救回来 → 直接结算；「放弃，结束游戏」直接结算。
  function isOverflow(){
    for (let c = 0; c < COLS; c++){
      if (stacks[c].length > ROWS) return true;
    }
    return false;
  }

  // 棋盘锁统一管理：整理/锤子/救场任一开启 → 禁投放（no-pointer）+ 禁滚动（selecting）
  function syncBoardLock(){
    const locked = reorgMode || hammerMode || rescueMode;
    colsEl.classList.toggle('no-pointer', locked);
    board.classList.toggle('selecting', locked);   // v4.10.1: 整理模式禁滚动（手机拖选）
  }

  // 救场模式开关：禁投子、道具可用（v5.9.3: 顶部提示行已删，不再切 hint 文案）
  function setRescueMode(on){
    rescueMode = on;
    syncBoardLock();
  }

  // 救场进展检查：每次道具使用后调用
  function rescueCheck(){
    if (!rescueMode) return;
    if (!isOverflow()){
      // 救回来了：恢复投子继续玩
      setRescueMode(false);
      beep(520, 0.15, 'sine', 0.12);   // 解除提示音
      comboEl.textContent = '✅ 救回来啦，继续！';
      setTimeout(() => { comboEl.textContent = ''; }, 1500);
      saveGame();
      return;
    }
    // 没解除：道具用尽直接结算；仍有可用道具则重开弹窗，始终保留“放弃结束”出口
    if (!canRescue()){
      setRescueMode(false);
      doGameOver(gen, 'overflow');
    } else {
      showRescueOverlay();
    }
  }

  // 越线弹窗：列出剩余道具
  function showRescueOverlay(){
    const powers = [];
    if (reorgLeft > 0) powers.push('🧹 整理 ×' + reorgLeft);
    if (canUseUndo()) powers.push('↩ 撤回 ×' + undoLeft);
    if (hammerLeft > 0) powers.push('🔨 锤子 ×' + hammerLeft);
    document.getElementById('rescuePowers').textContent = powers.join('　·　');
    rescueOverlay.classList.add('show');
  }

  // 拖拽框选的像素坐标 → 行列范围（行号 0 = 底部）
  function rectToSel(x0, y0, x1, y1){
    const cols = colsEl.children;
    const cs = getComputedStyle(board);
    const tile = parseFloat(cs.getPropertyValue('--tile')) || 40;
    const gap = parseFloat(cs.getPropertyValue('--gap')) || 2;
    const step = tile + gap;
    let c0 = COLS, c1 = -1;
    for (let c = 0; c < COLS; c++){
      const r = cols[c].getBoundingClientRect();
      if (r.left < x1 && r.right > x0){ c0 = Math.min(c0, c); c1 = Math.max(c1, c); }
    }
    if (c1 < c0) return null;
    // 基准底：选中列里栈底 tile 的底部（DOM 顺序 = 栈底→栈顶，column-reverse 渲染，t[0] 是栈底；v4.10.2 修正：原 t[length-1] 取到栈顶导致基准偏一格）
    let yBase = 0;
    for (let c = c0; c <= c1; c++){
      const t = cols[c].querySelectorAll('.stack .tile');
      if (t.length){ yBase = t[0].getBoundingClientRect().bottom; break; }
    }
    if (!yBase){
      const bg = cols[c0].querySelector('.col-bg') || cols[c0];
      yBase = bg.getBoundingClientRect().bottom - 4;   // 4 = 列内 padding
    }
    let r0 = Math.floor((yBase - y1) / step);
    let r1 = Math.floor((yBase - y0) / step);
    if (r0 < 0) r0 = 0;
    if (r1 < r0) return null;
    return { c0: c0, c1: c1, r0: r0, r1: r1 };
  }

  // v4.10.1: 行列范围 → 棋盘内像素矩形（hover 自动框选用，rectToSel 的逆变换）
  function selToRect(sel){
    const cols = colsEl.children;
    const cs = getComputedStyle(board);
    const tile = parseFloat(cs.getPropertyValue('--tile')) || 40;
    const gap = parseFloat(cs.getPropertyValue('--gap')) || 2;
    const step = tile + gap;
    const br = board.getBoundingClientRect();
    // v4.10.3: 修正 3px 边框偏差——reorgRect 是 absolute 定位，基准是 board 的 padding box（border 内侧）；
    //  而 getBoundingClientRect 的 left/top 是 border box 边缘，直接减会整体偏 3px（之前悬停框肉眼可见错位）
    const bs = getComputedStyle(board);
    const bTop = parseFloat(bs.borderTopWidth) || 0;
    const bLeft = parseFloat(bs.borderLeftWidth) || 0;
    const c0r = cols[sel.c0].getBoundingClientRect();
    const c1r = cols[sel.c1].getBoundingClientRect();
    let yBase = 0;
    for (let c = sel.c0; c <= sel.c1; c++){
      const t = cols[c].querySelectorAll('.stack .tile');
      if (t.length){ yBase = t[0].getBoundingClientRect().bottom; break; }   // v4.10.2: t[0]=栈底（column-reverse）
    }
    if (!yBase){
      const bg = cols[sel.c0].querySelector('.col-bg') || cols[sel.c0];
      yBase = bg.getBoundingClientRect().bottom - 4;
    }
    return {
      left: c0r.left - br.left - bLeft,
      top: (yBase - (sel.r1 + 1) * step) - br.top - bTop,
      width: c1r.right - c0r.left,
      height: (sel.r1 - sel.r0 + 1) * step
    };
  }

  // v4.10.1: 清掉悬停高亮（hover 自动框选是临时提示，进入拖动/取消/离开棋盘都要清）
  function clearHoverHL(){
    document.querySelectorAll('.tile.hover-hl').forEach(t => t.classList.remove('hover-hl'));
  }

  // v4.10.1: 整理模式下把悬停区域的高亮标到它内部的 tile 上
  function highlightHoverTile(sel){
    clearHoverHL();
    for (let c = sel.c0; c <= sel.c1; c++){
      const t = colsEl.children[c].querySelectorAll('.stack .tile');
      const hi = Math.min(sel.r1 + 1, t.length);
      for (let r = sel.r0; r < hi; r++){
        const tileEl = t[r];   // v4.10.2: t 是栈底→栈顶（column-reverse），行号 0=底部 → t[0]（原 t[length-1-r] 取反导致高亮错位一格）
        if (tileEl) tileEl.classList.add('hover-hl');
      }
    }
  }

  // 执行整理：返回是否真的重排了（区域棋子 ≥2 才算）
  function reorgApply(sel){
    // 1. 提取：区域 [r0, r1] 内的棋子取出来（每列提取数 = 该列原高不变 → 回填后列高不变，绝不越线）
    const pool = [];
    const caps = {};
    const lower = {}, upper = {}, orig = {};
    // v4.10.4 修复:提取范围必须限定在框选列 sel.c0..sel.c1 内——原代码遍历全部 COLS 列,
    //  导致 hover 出 2×2/3×3 黄框后点一下,就把所有列同高度的行区间都提取重排,
    //  整理范围远超黄框(用户实测反馈"没有按从左到右、从下到上排列")
    for (let c = sel.c0; c <= sel.c1; c++){
      const col = stacks[c];
      const lo = Math.min(sel.r0, col.length);
      const hi = Math.min(sel.r1 + 1, col.length);
      if (lo < hi){
        caps[c] = hi - lo;
        lower[c] = col.slice(0, lo);
        upper[c] = col.slice(hi);
        orig[c] = col.slice(lo, hi);
        for (let r = lo; r < hi; r++) pool.push(col[r]);
      }
    }
    if (pool.length < 2) return false;   // 区域不足 2 个，整理无意义
    // 2. 排序：降序（大在下、小在上——大的沉底，安琪 v4.10.1 定）
    pool.sort((a, b) => b - a);
    // 3. 预计算回填结果，对比选中区域整理前后——完全一样就不消耗次数（避免白用）
    let idx = 0, changed = false;
    const filledByCol = {};
    for (let c = sel.c0; c <= sel.c1; c++){
      const cap = caps[c] || 0;
      filledByCol[c] = pool.slice(idx, idx + cap);
      idx += cap;
      if (!changed && orig[c] && orig[c].length === filledByCol[c].length){
        let same = true;
        for (let i = 0; i < orig[c].length; i++){ if (orig[c][i] !== filledByCol[c][i]){ same = false; break; } }
        if (!same) changed = true;
      }
    }
    if (!changed) return false;
    // 4. 真正生效:清空撤销栈——整理是不可逆分界线,整理前的落子不可再撤回
    // （若保留整理前快照,玩家可"整理→撤回→再整理"白嫖整理次数;清栈后撤回只能撤整理之后的新落子）
    undoStack = [];
    reorgLeft--;
    for (let c = sel.c0; c <= sel.c1; c++){
      const cap = caps[c] || 0;
      if (cap) stacks[c] = (lower[c] || []).concat(filledByCol[c], upper[c] || []);
    }
    return true;
  }

  // 全盘扫描相邻相同 → 合并升级 → 连锁直到稳定（异步分步动画，参照 settleMerge 的 busy/gen 语义）
  async function fullMerge(myGen){
    let chains = 0, lastC = -1, lastR = -1, guard = 0;
    let changed = true;
    while (changed && guard++ < 200){
      changed = false;
      for (let c = 0; c < COLS; c++){
        for (let r = 0; r < stacks[c].length; r++){
          const same = findNeighbors(c, r);
          if (!same.length) continue;
          const lv = stacks[c][r];
          const nl = lv + same.length;   // 吸收 k 个 → 跳 k 级（同 settleMerge）
          await flashSet(c, r, same);   // 碰撞闪烁 + 音效（自带 280ms 等待）
          if (myGen !== gen) return { chains: 0 };
          // 删除被吸收：按列分组，每列从高 row 往下 splice（下方被删会让 r 下移，先记偏移）
          const byCol = {};
          same.forEach(p => { (byCol[p.col] = byCol[p.col] || []).push(p.row); });
          let below = 0;
          for (const cc in byCol){
            byCol[cc].sort((a, b) => b - a);   // 高 → 低
            for (const rr of byCol[cc]){
              if (cc == c && rr < r) below++;   // 主体列下方被删的数量 → 新位置偏移
              stacks[cc].splice(rr, 1);
            }
          }
          const newR = r - below;
          stacks[c][newR] = nl;
          if (nl > maxLevel) maxLevel = nl;
          chains++;
          changed = true;
          lastC = c; lastR = newR;
          render();
          const colEl = colsEl.children[c];
          const tiles = colEl.querySelectorAll('.stack .tile');
          const el = tiles[newR] || null;
          if (el){
            el.classList.add('merge-pop', 'merge-glow');
            setTimeout(() => el.classList.remove('merge-pop', 'merge-glow'), 800);
          }
          mergeSound(nl);
          await sleep(320);
          if (myGen !== gen) return { chains: 0 };
          break;   // 棋盘已变，重新扫描
        }
        if (changed) break;
      }
    }
    return { chains: chains, lastC: lastC, lastR: lastR };
  }

  // 整理入口：框选确认后调用（同步重排 + 异步连锁）
  async function doReorg(sel){
    if (!running || busy) return;
    if (reorgLeft <= 0) return;
    if (!reorgApply(sel)){ beep(150, 0.15, 'square', 0.08); rescueCheck(); return; }   // 区域无效：救场中重新给出放弃出口
    trackEvent('power_use', { type: 'reorg', left: reorgLeft - 1 });   // v5.4: 道具埋点（reorgApply 已消耗次数）
    setReorgMode(false);
    busy = true;
    updatePowerUI();
    render(); renderNext(); fitBoard();
    const myGen = gen;
    try {
      await sleep(200);   // 重排落定感
      if (myGen !== gen) return;
      const res = await fullMerge(myGen);
      if (!res.chains){
        beep(240, 0.12, 'sine', 0.08);   // 没合成：纯重排，低柔一声
      } else {
        let topLevel = 0;
        for (let c = 0; c < COLS; c++) for (const v of stacks[c]) topLevel = Math.max(topLevel, v);
        const gain = Math.round(topLevel * 18 * Math.pow(1.5, res.chains - 1));   // 与普通合成同公式
        score += gain;
        updateScore();
        const colEl = colsEl.children[res.lastC];
        const tiles = colEl.querySelectorAll('.stack .tile');
        spawnFX(res.lastC, topLevel, res.chains, tiles[res.lastR] || null);
        if (res.chains > 1) beep(420 + topLevel * 45 * 1.5, 0.16, 'sine', 0.11, 0.07);
        comboEl.textContent = `整理连击 x${res.chains}`;
        setTimeout(() => { comboEl.textContent = ''; }, 1300);
        if (res.chains >= 5){
          const el = document.getElementById('celebration');
          const msgs = {
            5: '💧 整理泡泡 ×5',
            6: '💦 整理水花 ×6',
            7: '🌸 整理 ×7 好棒',
            8: '🌈 整理 ×8 太厉害',
            9: '🌟 整理 ×9 超可爱',
          };
          el.textContent = msgs[res.chains] || `✨ 整理连击 ×${res.chains} 最棒！`;
          el.classList.remove('show');
          void el.offsetWidth;
          el.classList.add('show');
        }
      }
    } finally {
      if (myGen !== gen) return;
      busy = false;
      updatePowerUI();
      if (rescueMode) rescueCheck();   // v5.9: 救场中整理后检查是否解除越线
      else checkGameOver();
      if (running) saveGame();
    }
  }

  // ===== 投放（点击列） =====
  function drop(colIdx){
    if (!running) return;
    if (rescueOverlay.classList.contains('show') || dupOverlay.classList.contains('show')) return;
    if (busy) return;   // v4.9.6: 合成动画未完成时点击不投放（推翻 v4.9 排队补投——动画结束自动投出非玩家预期）
    if (reorgMode) return;   // v4.10.0: 整理模式中禁投放
    if (hammerMode || rescueMode) return;   // v5.9: 锤子模式/救场模式中禁投放
    pushUndo();   // v4.10.0: 落子前压快照（撤回用）
    busy = true;
    updatePowerUI();   // v4.10.0: 动画期间禁用道具
    dropCount++;
    const level = nextQueue.shift();
    nextQueue.push(rollLevel());   // v4.9.14: 先临时补位（防预览 undefined），合成完成后会用最新棋盘值替换队尾
    renderNext();
    stacks[colIdx].push(level);
    render();

    // 落子动画：新棋子（栈顶）从顶部掉入
    const colEl = colsEl.children[colIdx];
    const tiles = colEl.querySelectorAll('.stack .tile');
    const landed = tiles[tiles.length - 1];
    if (landed){
      landed.classList.add('fall');
      setTimeout(() => landed.classList.remove('fall'), 260);
    }
    // 自动合成：相邻相同合并升级（分步动画），连锁（稍等落子动画）
    const myGen = gen;   // v4.9: 记录局号——若连锁途中玩家点了"重新开始"，旧局的收尾全部作废
    setTimeout(async () => {
      try {
        beep(150 + level * 5, 0.09, 'sine', 0.13);   // v4.9.6: 落定音——方块到位置才响（低频闷响，与合成上行琶音明确区分），无合成也响
        await settleMerge(colIdx, myGen);
      } catch (e) {
        console.error('settleMerge error:', e);
        render();  // 异常时兜底：重建棋盘，避免状态错乱
      } finally {
        if (myGen !== gen) return;   // 局已换：checkGameOver/saveGame 都归新局管
        busy = false;  // 无论合成是否正常完成，都解锁投放，防止卡死
        updatePowerUI();   // v4.10.0: 动画结束恢复道具可用
        // v4.9.14-r5: 恢复最初逻辑——不再在合成后替换队尾（那会导致 next2 预览每次合成后重新抽，数字乱跳）。
        //  nextQueue 在 drop 开头 shift+push 时已定死，合成完成后只刷新预览显示，不动队列
        renderNext();
        checkGameOver();
        if (running) saveGame();   // 每步落定后存档（续玩用）
      }
    }, 260);   // v4.9.11: 230→260，与落子动画时长对齐——方块落稳才开始合成，节奏不飘
  }

  // ===== 自动合成（分步动画版） =====
  // 规则（对齐原版 + 玩家反馈）：
  //  · 合成只发生在"掉落/上次合成"位置附近——别处的相邻相同方块保持原样，
  //    等玩家投到那列才会触发，不会投一个小方块就把别处大数字也合掉
  //  · 新方块落下时吸收周围一圈（上/下/左/右）的相同方块一起合，
  //    吸收 k 个 → 跳 k 级（2个→+1，3个→+2，如 3+3+3 → 5），结果留在掉落位置
  //  · 每组合成都播放完整过程：碰撞闪烁 → 旧方块缩小消失 → 新数字弹出，
  //    然后再找下一对，连锁直到稳定
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // 以 (colIdx, row) 为中心，找所有相邻相同方块（上/下/左/右）
  // 关键1：合成只发生在"掉落/上次合成"位置附近——别处的相邻相同方块保持原样，
  //        不会因为投了一个小方块就把棋盘另一角的大数字也合掉
  // 关键2：新方块落下时会把"周围一圈"的相同方块全部吸收进来一起合，
  //        吸收 k 个 → 跳 k 级（2个→+1级，3个→+2级，如 3+3+3 → 5）
  function findNeighbors(colIdx, row){
    const level = stacks[colIdx][row];
    const same = [];
    if (row > 0 && stacks[colIdx][row-1] === level) same.push({col: colIdx, row: row-1});            // 下
    if (row < stacks[colIdx].length - 1 && stacks[colIdx][row+1] === level) same.push({col: colIdx, row: row+1});  // 上
    if (colIdx > 0 && stacks[colIdx-1][row] === level) same.push({col: colIdx-1, row: row});          // 左
    if (colIdx < COLS - 1 && stacks[colIdx+1][row] === level) same.push({col: colIdx+1, row: row});   // 右
    return same;
  }

  // 参与合成的一组方块碰撞闪烁（中心 + 所有被吸收的）
  function flashSet(colIdx, row, same){
    return new Promise(resolve => {
      const els = [];
      const tiles0 = colsEl.children[colIdx].querySelectorAll('.stack .tile');
      const center = tiles0[row];
      if (center) els.push(center);
      for (const s of same){
        const tiles = colsEl.children[s.col].querySelectorAll('.stack .tile');
        const el = tiles[s.row];
        if (el) els.push(el);
      }
      els.forEach(el => el.classList.add('merge-flash'));
      beep(330, 0.07, 'triangle', 0.06);
      setTimeout(() => {
        els.forEach(el => el.classList.remove('merge-flash'));
        resolve();
      }, 280);
    });
  }

  // 被吸收的旧方块缩小淡出（render 前播放）
  function goneSet(same){
    return new Promise(resolve => {
      const els = [];
      for (const s of same){
        const tiles = colsEl.children[s.col].querySelectorAll('.stack .tile');
        const el = tiles[s.row];
        if (el) els.push(el);
      }
      if (els.length === 0) return resolve();
      let pending = els.length;
      els.forEach(el => {
        el.classList.add('merge-gone');
        setTimeout(() => { el.classList.remove('merge-gone'); pending--; if (pending <= 0) resolve(); }, 250);
      });
    });
  }

  async function settleMerge(colIdx, myGen, initKeys){
    let chains = 0, guard = 0;
    let lastC = -1, lastR = -1;   // 最后一次合成/消除位置（spawnFX 用）
    // 队列式连锁（2026-08-18 v4.2 修复）：
    // 每次合成后，把"升级位置"和"每个删除位置的下移链"全部入队，逐个处理。
    // 修复 findCascade 两个漏洞：① 返回坐标错误（相同方块在相邻列时返回自己列，
    //   导致合成结果放错位置 → 同列相邻相同方块出现）；② 升级位置与删除列只能二选一，
    //   另一个被遗忘 → 棋盘遗留非法状态。
    const queue = new Set();
    // v5.9.15: 锤子场景调用方传 initKeys（被砸列所有格子）作初始位置——整列下移后每个格子都可能是
    // 新的相邻相同起点；默认（落子场景）=落子位置栈顶
    if (initKeys){ for (const k of initKeys) queue.add(k); }
    else queue.add(colIdx + ',' + (stacks[colIdx].length - 1));
    while (queue.size > 0){
      if (myGen !== gen) return;   // v4.9: 连锁途中开了新局，旧连锁立即作废（防止旧局方块写进新棋盘）
      if (++guard > 500) break;   // 死循环保险
      const key = queue.values().next().value;
      queue.delete(key);
      const keyParts = key.split(',');
      const c = +keyParts[0], r = +keyParts[1];
      if (c < 0 || c >= COLS || r < 0 || r >= stacks[c].length) continue;  // 位置已失效
      const same = findNeighbors(c, r);
      if (same.length === 0) continue;
      const level = stacks[c][r];
      // 吸收 k 个相同 → 跳 k 级（结果留在当前处理位置）
      // v4.3: 无上限合成——11+11 → 12，一直往上（2026-08-18 用户要求"不要卡在11"）
      const nl = level + same.length;
      if (nl > maxLevel) maxLevel = nl;   // v4.8: 记录本局最大合成数字
      // 1) 预备：所有参与方块碰撞闪烁
      await flashSet(c, r, same);
      // 2) 被吸收的方块缩小消失
      await goneSet(same);
      if (myGen !== gen) return;   // v4.9: 动画等待期间开了新局，别再写新棋盘
      // 3) 应用合并：先删被吸收的（同列从高 row 往下删，避免索引错乱）
      const below = same.filter(s => s.col === c && s.row < r).length;
      const sorted = [...same].sort((a, b) => b.row - a.row);
      for (const s of sorted){
        stacks[s.col].splice(s.row, 1);
      }
      const newRow = r - below;   // 删除下方方块后，结果位置上移
      stacks[c][newRow] = nl;
      chains++;
      lastC = c; lastR = newRow;
      render();
      // 4) 入队"升级位置"：升级后的方块可能与其邻居（含同列上下）相同，必须重新检查
      queue.add(c + ',' + newRow);
      // 5) 入队"删除位置的下移链"：splice 后受影响列上方方块整体下移，
      //    从删除位置向上扫，任何与"新邻居"（下/左/右）相同的方块都继续连锁。
      //    注意：不能遇到第一个匹配就 break——同一列可能有多个下移方块产生新邻居，
      //    漏掉一个就会留下同列相邻相同的非法状态（2026-08-18 v4.2 实测教训）
      for (const s of sorted){
        const col = stacks[s.col];
        for (let rr = s.row; rr < col.length; rr++){
          const v = col[rr];
          if (rr > 0 && col[rr-1] === v) queue.add(s.col + ',' + rr);
          if (s.col > 0 && stacks[s.col-1][rr] === v) queue.add(s.col + ',' + rr);
          if (s.col < COLS - 1 && stacks[s.col+1][rr] === v) queue.add(s.col + ',' + rr);
        }
      }
      // 6) 新数字弹出动画 + 合成音
      const tiles = colsEl.children[c].querySelectorAll('.stack .tile');
      const el = tiles[newRow];
      if (el){
        el.classList.add('merge-pop', 'merge-glow');
        setTimeout(() => el.classList.remove('merge-pop', 'merge-glow'), 800);
      }
      // 合成成功：等级越高音越亮，快速上行琶音（更有满足感）
      mergeSound(nl);
      await sleep(320);
    }
    if (chains === 0) return;

    // 计分：取棋盘上最大等级作为本次合成的代表等级
    let topLevel = 0;
    for (let c = 0; c < COLS; c++){
      for (const v of stacks[c]) topLevel = Math.max(topLevel, v);
    }
    const gain = Math.round(topLevel * 18 * Math.pow(1.5, chains - 1));   // v4.9.14: 基础 15→18、指数 1.3→1.5——连击越多加得越猛（1连1x 2连1.5x 3连2.25x 5连5.1x）
    score += gain;
    updateScore();

    if (lastC < 0) lastC = 0, lastR = 0;
    const colEl = colsEl.children[lastC];
    const tiles = colEl.querySelectorAll('.stack .tile');
    const result = tiles[lastR] || null;
    spawnFX(lastC, topLevel, chains, result);

    // 连锁结束的升调音效
    if (chains > 1) beep(420 + topLevel * 45 * 1.5, 0.16, 'sine', 0.11, 0.07);

    if (chains > 1){
      comboEl.textContent = `连击 x${chains}`;
      setTimeout(() => { comboEl.textContent = ''; }, 1300);
    }

    // 连消 5 次以上：庆祝提示（弹入 → 停留 → 1.6s 自动淡出，不阻塞游戏）
    if (chains >= 5){
      const el = document.getElementById('celebration');
      // v4.9.14: 可爱风文案（原"神操作/逆天"太土味）——沐浴主题 + 软萌语气
      const msgs = {
        5: '💧 泡泡连击 ×5',
        6: '💦 水花四溅 ×6',
        7: '🌸 连击 ×7 好棒',
        8: '🌈 连击 ×8 太厉害',
        9: '🌟 连击 ×9 超可爱',
      };
      el.textContent = msgs[chains] || `✨ 连击 ×${chains} 最棒！`;
      el.classList.remove('show');
      void el.offsetWidth;   // 强制重排，重启动画
      el.classList.add('show');
    }
  }

  async function checkGameOver(){
    const myGen = gen;   // v4.9: 记录局号——等待提交期间开了新局，就不再弹结算榜
    if (!isOverflow()) return;
    // v5.9: 超线不再直接结束——有道具先弹救场确认框（防误触/给道具救场机会）
    if (canRescue() && !rescueMode){
      showRescueOverlay();
      return;   // 等玩家选择，不结算
    }
    await doGameOver(myGen, 'overflow');
  }

  // v5.9: 结算统一入口（越线 / 救场放弃 / 道具用尽）
  async function doGameOver(myGen, reason){
    running = false;
    clearSave();   // v4.9: 结束即清存档——否则死后强退再进会"复活"到临终棋盘
    trackEvent('game_over', { score: score, maxLevel: maxLevel, duration: Math.round((Date.now() - gameStartTs) / 1000), reason: reason || 'overflow' });   // v5.4: 结算埋点（越线结束）
    if (score > best){
      best = score;
      try { localStorage.setItem('animalBathBest', String(best)); } catch (e) { /* 忽略：无法保存最高分不影响游玩 */ }
      bestEl.textContent = best.toLocaleString();
    }
    // v4.8: 结算直接弹排行榜（显示名次 + 超越多少人），关闭排行榜后自动开新局
    // 提交分数与最后的合成动画（≥500ms）并行，不额外等待
    await Promise.all([
      submitScore(),
      new Promise(r => setTimeout(r, 500))
    ]);
    if (myGen !== gen) return;   // v4.9: 等待期间已开新局，别弹榜
    showRank(true);
  }

  // ===== 云端 / 存档 / 排行榜 =====
  function sbFetch(path, opts){
    opts = opts || {};
    // 注意：必须合并 headers，不能覆盖——POST 时传的 Prefer 会丢掉 apikey 导致 401
    const headers = Object.assign({}, SB_HEADERS, opts.headers || {});
    // v5.8: 所有 Supabase 请求 8 秒超时兜底（AbortController）——国内网络下 Supabase 偶发连接抖动/SSL 中断，
    //       fetch 挂起既不 resolve 也不 reject（看板 8/20 实测同款），无超时会把后续请求/交互全拖住
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    const p = fetch(SUPABASE_URL + '/rest/v1/' + path, Object.assign({}, opts, { headers: headers, signal: ctrl.signal }));
    p.then(() => clearTimeout(timer), () => clearTimeout(timer));
    return p;
  }

  // ===== 数据埋点 tracker（v5.4 起，安琪拍板：看板只给自己看、落子不埋） =====
  // 事件：page_view / login / game_start / game_over / power_use / rank_view / upd_view / restart
  // 规则：队列批量提交（攒 5 条或 5 秒 flush 一次）；页面关闭 fetch keepalive 兜底（sendBeacon 带不了 apikey 头，用 keepalive 替代）；
  //       session_id 存 localStorage，30 分钟无操作生成新会话；所有失败静默，绝不影响游玩。
  let evtQueue = [];
  let evtTimer = null;
  let gameStartTs = 0;   // 本局开始时间戳（game_over 算用时）

  function evtSessionId(){
    const now = Date.now();
    try {
      const raw = localStorage.getItem('animalBathSession');
      if (raw){
        const s = JSON.parse(raw);
        if (now - s.t < 30 * 60 * 1000){ s.t = now; localStorage.setItem('animalBathSession', JSON.stringify(s)); return s.id; }
      }
    } catch (e) {}
    const s = { id: Math.random().toString(36).slice(2) + now.toString(36), t: now };
    try { localStorage.setItem('animalBathSession', JSON.stringify(s)); } catch (e) {}
    return s.id;
  }

  function evtFlush(){
    if (!evtQueue.length) return;
    const batch = evtQueue;
    evtQueue = [];
    if (evtTimer){ clearTimeout(evtTimer); evtTimer = null; }
    try {
      sbFetch('events', {   // v5.8: 走 sbFetch 统一拿 8s 超时，防埋点挂起占连接
        method: 'POST',
        headers: Object.assign({}, SB_HEADERS, { 'Prefer': 'return=minimal' }),
        body: JSON.stringify(batch.map(stripEvtMeta))
      }).catch(() => retryBatch(batch));   // v5.9.16: 失败不再静默丢——放回队列重试
    } catch (e) { retryBatch(batch); }
  }

  function trackEvent(event, payload){
    try {
      evtQueue.push({ event: event, nickname: nickname || '', session_id: evtSessionId(), payload: payload || null });
      if (evtQueue.length >= 5){ evtFlush(); return; }
      if (!evtTimer) evtTimer = setTimeout(evtFlush, 5000);
    } catch (e) {}
  }

  // v5.9.16: 弱网防丢——flush 失败把事件放回队列头（保持时序），指数退避重试；超 5 次丢弃防死循环
  // （2026-08-24 实测教训：网络抖动时 saves 靠 3s 防抖持续重试能写入，events flush 失败即丢全没了）
  let evtRetryTimer = null;
  function retryBatch(batch){
    const alive = batch.filter(e => (e._r || 0) < 5);
    if (!alive.length){ try { console.warn('[evt] 埋点重试超限丢弃', batch.length, '条'); } catch (e) {} return; }
    const retried = alive.map(e => Object.assign({}, e, { _r: (e._r || 0) + 1 }));
    evtQueue = retried.concat(evtQueue);
    const delay = Math.min(60000, 5000 * Math.pow(2, retried[0]._r - 1));   // 5s/10s/20s/40s/60s
    if (evtRetryTimer) clearTimeout(evtRetryTimer);
    evtRetryTimer = setTimeout(evtFlush, delay);
  }

  // 剥离内部字段（_r 重试计数 / _t 落盘时间戳）——PostgREST 遇未知列会整批 400
  function stripEvtMeta(e){
    const c = Object.assign({}, e);
    delete c._r; delete c._t;
    return c;
  }

  // v5.9.16: 关页兜底也失败 → 存 localStorage，下次打开补报（保底不丢）
  const EVT_PENDING_KEY = 'animalBathPendingEvents';
  function persistPending(batch){
    try {
      const old = JSON.parse(localStorage.getItem(EVT_PENDING_KEY) || '[]');
      const now = Date.now();
      const merged = old.concat(batch.map(e => Object.assign({}, e, { _t: now })));
      localStorage.setItem(EVT_PENDING_KEY, JSON.stringify(merged.slice(-200)));   // 上限 200 条防爆
    } catch (e) {}
  }
  function flushPending(){
    try {
      const raw = localStorage.getItem(EVT_PENDING_KEY);
      if (!raw) return;
      const pending = JSON.parse(raw);
      if (!pending.length){ localStorage.removeItem(EVT_PENDING_KEY); return; }
      sbFetch('events', {
        method: 'POST',
        headers: Object.assign({}, SB_HEADERS, { 'Prefer': 'return=minimal' }),
        body: JSON.stringify(pending.map(stripEvtMeta))
      }).then(() => localStorage.removeItem(EVT_PENDING_KEY)).catch(() => {});   // 成功才清，失败留待下次
    } catch (e) {}
  }

  // 页面关闭/隐藏：keepalive 兜底最后一批（带 apikey 头，sendBeacon 做不到）
  window.addEventListener('pagehide', () => {
    const batch = evtQueue; evtQueue = [];
    if (evtTimer){ clearTimeout(evtTimer); evtTimer = null; }
    if (!batch.length) return;
    try {
      fetch(SUPABASE_URL + '/rest/v1/events', {
        method: 'POST',
        headers: Object.assign({}, SB_HEADERS, { 'Prefer': 'return=minimal' }),
        body: JSON.stringify(batch.map(stripEvtMeta)),
        keepalive: true
      }).catch(() => persistPending(batch));
    } catch (e) { persistPending(batch); }
  });

  // 本局存档（续玩）：本地立即写，云端防抖 3 秒
  function saveGame(){
    if (!nickname) return;
    const state = { stacks: stacks, score: score, dropCount: dropCount, nextQueue: nextQueue, maxLevel: maxLevel, nickname: nickname, ver: VER, reorgLeft: reorgLeft, undoLeft: undoLeft, hammerLeft: hammerLeft };   // v4.9: 存档带最大合成数（续玩不断档）+ 绑昵称（防换号读到别人存档）；v4.9.12: 带版本号（旧版存档作废）；v4.10.0: 道具次数进存档（续玩不重置）；v4.10.6: 整理后清撤销栈（原 reorgUsed 字段废弃，旧档缺字段默认 false 兼容）；v5.9: 锤子次数进存档；v5.9.11: 读档放宽为版本下限校验，此字段仍是当前版本标记（下次保存自动升级）
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
    if (cloudTimer) clearTimeout(cloudTimer);
    cloudTimer = setTimeout(() => {
      try {
        sbFetch('saves', {
          method: 'POST',
          headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
          body: JSON.stringify({ nickname: nickname, state: state })
        }).catch(() => {});
      } catch (e) {}
      syncLiveScore();   // v4.9.6: 随存档节奏同步实时分数上榜（仅破纪录时才真正写库）
    }, 3000);
  }

  // v4.9.6: 实时上榜——本局分超过榜上该昵称历史最高时才写库；未超过零写请求（安琪定）。
  // liveBest 缓存"已知的榜上最高分"，常规步直接被它挡掉，连 GET 都不发；
  // 破纪录时 PATCH 定位最高行同行刷新（nickname+旧分精准定位，不堆重复行）。
  let liveBest = 0;
  async function syncLiveScore(){
    if (!nickname || !running || score <= liveBest) return;
    try {
      const r = await sbFetch('scores?select=score,max_level&nickname=eq.' + encodeURIComponent(nickname) + '&order=score.desc&limit=1');
      const rows = await r.json();
      if (Array.isArray(rows) && rows.length){
        const histScore = Number(rows[0].score) || 0;
        const histMax = Number(rows[0].max_level) || 1;
        liveBest = Math.max(liveBest, histScore);
        if (score <= histScore) return;   // 没破纪录：不写
        await sbFetch('scores?nickname=eq.' + encodeURIComponent(nickname) + '&score=eq.' + histScore, {
          method: 'PATCH',
          headers: { 'Prefer': 'return=minimal' },
          body: JSON.stringify({ score: score, max_level: Math.max(maxLevel, histMax) })
        });
      } else {
        await sbFetch('scores', {
          method: 'POST',
          headers: { 'Prefer': 'return=minimal' },
          body: JSON.stringify({ nickname: nickname, score: score, max_level: maxLevel })
        });
      }
      liveBest = score;
    } catch (e) {}
  }

  function clearSave(){
    if (cloudTimer) clearTimeout(cloudTimer);
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    if (nickname){
      sbFetch('saves?nickname=eq.' + encodeURIComponent(nickname), { method: 'DELETE' }).catch(() => {});
    }
  }

  // v5.9.11: 存档宽容校验——不再要求版本号严格等于当前版。结构完整（stacks 数组 + score 数字）且版本 >= COMPAT_VER 的旧档一律带过来续玩：
  // 纯 UI 迭代（v5.9.5 后）刷新不再丢局；v5.9 之前的档/无版本号/结构损坏的档才作废（规则变化大，棋盘状态可能不兼容）。
  // COMPAT_VER = v5.9：v5.9 引入 hammerLeft 且读档缺字段默认 1（之后存档结构零变化），作为兼容最低线
  const COMPAT_VER = 'v5.9';
  function verNum(s){
    const m = String(s || '').match(/^v(\d+)(?:\.(\d+))?/);
    return m ? Number(m[1]) * 1000 + Number(m[2] || 0) : -1;   // 忽略 patch 级（不影响结构），v5.9.x 均视为 v5.9
  }
  // v4.9.12: 存档版本校验——旧版本（含无版本号）的存档视为无效，直接作废清掉（v5.9.11: 放宽为结构+版本下限双重校验）
  function saveIsCurrent(state){
    if (!state || typeof state !== 'object' || !Array.isArray(state.stacks) || typeof state.score !== 'number') return false;
    return verNum(state.ver) >= verNum(COMPAT_VER);
  }

  function loadLocalSave(){
    try {
      const state = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
      if (state && !saveIsCurrent(state)){ clearSave(); return null; }   // v4.9.12: 旧版本本地存档作废（v5.9.11: 放宽——仅结构损坏或低于 v5.9 的档作废，纯 UI 迭代的旧档保留续玩）
      return state;
    } catch (e) { return null; }
  }

  async function checkCloudSave(){
    if (!nickname) return null;
    try {
      const r = await sbFetch('saves?select=state&nickname=eq.' + encodeURIComponent(nickname) + '&limit=1');
      const rows = await r.json();
      if (Array.isArray(rows) && rows.length){
        const state = rows[0].state;
        if (!saveIsCurrent(state)){   // v4.9.12: 旧版本云端存档作废（v5.9.11: 放宽——仅结构损坏或低于 v5.9 的档作废）
          sbFetch('saves?nickname=eq.' + encodeURIComponent(nickname), { method: 'DELETE' }).catch(() => {});
          return null;
        }
        return state;
      }
      return null;
    } catch (e) { return null; }
  }

  // 恢复存档
  function restoreGame(state){
    if (!state || !saveIsCurrent(state) || !Array.isArray(state.stacks) || state.stacks.length !== COLS){ startNewGame(); return; }   // v4.9.12: 版本不符防御兜底
    stacks = state.stacks.map(col => Array.isArray(col) ? col.map(Number) : []);
    score = Number(state.score) || 0;
    dropCount = Number(state.dropCount) || 0;
    maxLevel = Number(state.maxLevel) || 1;   // v4.9: 恢复最大合成数（旧存档没这字段则回 1）
    nextQueue = Array.isArray(state.nextQueue) ? state.nextQueue.map(Number) : [];
    if (nextQueue.length < 2) nextQueue = [rollLevel(), rollLevel()];
    // v4.10.0: 道具次数恢复（旧档/缺字段回默认——VER 已隔离旧版，此处仅防御）
    reorgLeft = Number.isFinite(Number(state.reorgLeft)) ? Number(state.reorgLeft) : 1;
    undoLeft = Number.isFinite(Number(state.undoLeft)) ? Number(state.undoLeft) : 2;
    hammerLeft = Number.isFinite(Number(state.hammerLeft)) ? Number(state.hammerLeft) : 1;   // v5.9: 锤子次数恢复（旧档缺字段回默认）
    undoStack = [];   // 续玩不继承撤回栈（跨会话撤回无意义，防止旧局快照污染新盘）
    reorgMode = false; reorgSel = null;
    hammerMode = false; hammerSel = null;   // v5.9
    rescueMode = false;   // v5.9: 续玩不继承救场状态（恢复后按棋盘重新判断）
    updatePowerUI();
    running = true; busy = false;
    updateScore();
    render(); renderNext(); fitBoard();
    hideNameOverlay();
    gameStartTs = Date.now();
    trackEvent('game_start', { continue: true });   // v5.4: 续玩埋点
    // v5.9: 续玩恢复的棋盘若已越线（救场中强退留下的存档）——有道具弹救场，没道具直接结算
    if (isOverflow()){
      if (canRescue()) showRescueOverlay();
      else doGameOver(gen, 'overflow');
    }
  }

  // 新开一局（清除旧存档）
  function startNewGame(){
    clearSave();
    init();
    hideNameOverlay();
    gameStartTs = Date.now();
    trackEvent('game_start', { continue: false });   // v5.4: 新局埋点
  }

  // 结算：提交分数到排行榜（同名已有更高分则跳过）。返回是否成功
  async function submitScore(){
    if (!nickname || !score) return false;
    // 5 秒超时：网络差时不能让弹窗一直卡在"提交中"
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 5000);
    try {
      const r = await sbFetch('scores?select=score,max_level&nickname=eq.' + encodeURIComponent(nickname) + '&order=score.desc&limit=1', { signal: ctrl.signal });
      const rows = await r.json();
      let histMax = 1;   // 该昵称历史最大合成（保持"每个人的最大合成数"独立最佳）
      if (Array.isArray(rows) && rows.length){
        histMax = rows[0].max_level || 1;
        if (rows[0].score >= score){
          // v4.8.2: 分数不更高，但本局最大合成可能更大 → 就地更新最高纪录行的 max_level
          if (maxLevel > histMax){
            await sbFetch('scores?nickname=eq.' + encodeURIComponent(nickname) + '&score=eq.' + rows[0].score, {
              method: 'PATCH',
              headers: { 'Prefer': 'return=minimal' },
              body: JSON.stringify({ max_level: maxLevel }),
              signal: ctrl.signal
            });
          }
          return true;
        }
      }
      const p = await sbFetch('scores', {
        method: 'POST',
        headers: { 'Prefer': 'return=minimal' },
        // v4.8.3: 破纪录时继承历史最大合成——最大分值与最大合成数各自保持历史最佳
        body: JSON.stringify({ nickname: nickname, score: score, max_level: Math.max(maxLevel, histMax) }),
        signal: ctrl.signal
      });
      if (p.ok) return true;
      // v4.8 兼容：旧表没有 max_level 列（PGRST204）→ 降级只提交分数
      const p2 = await sbFetch('scores', {
        method: 'POST',
        headers: { 'Prefer': 'return=minimal' },
        body: JSON.stringify({ nickname: nickname, score: score }),
        signal: ctrl.signal
      });
      return p2.ok;
    } catch (e) {
      return false;   // 离线/失败：不影响游玩，弹窗提示未上榜
    } finally {
      clearTimeout(timer);
    }
  }

  // 拉取排行榜：同名取最高分，全部排名 + 我的排名 + 总人数
  async function fetchBoardList(){
    // v4.8.1 修复：旧表没有 max_level 列时带列查询会报错 → 降级只查基础字段
    let rows = null;
    try {
      const r = await sbFetch('scores?select=nickname,score,max_level&order=score.desc&limit=1000');
      const j = await r.json();
      if (Array.isArray(j)) rows = j;
    } catch (e) {}
    if (!rows){
      const r = await sbFetch('scores?select=nickname,score&order=score.desc&limit=1000');
      const j = await r.json();
      if (Array.isArray(j)) rows = j;
    }
    if (!Array.isArray(rows)) return { list: [], mine: null, total: 0 };
    const map = new Map();
    for (const row of rows){
      const prev = map.get(row.nickname);
      if (!prev || row.score > prev.score) map.set(row.nickname, { nickname: row.nickname, score: row.score, maxLevel: row.max_level || 1 });
    }
    const all = [...map.values()].sort((a, b) => b.score - a.score);
    const list = all;
    let mine = null;
    if (nickname){
      const idx = all.findIndex(x => x.nickname === nickname);
      if (idx >= 0) mine = { rank: idx + 1, score: all[idx].score, maxLevel: all[idx].maxLevel || 1 };
    }
    return { list: list, mine: mine, total: all.length };
  }

  // 展示排行榜。fromGame=true 表示结算直显：顶部显示本局名次 + 超越人数，关闭后自动开新局
  async function showRank(fromGame){
    afterGameRank = !!fromGame;
    if (!fromGame) trackEvent('rank_view', {});   // v5.4: 手动看榜埋点（结算直显不重复计）
    rankOverlay.classList.add('show');
    rankLoading.style.display = 'block';
    rankList.style.display = 'none';
    rankMine.style.display = 'none';
    rankList.innerHTML = '';
    // v4.9.14-r8: 结算战报——本局最高合成（大 emoji + 等级），手动看榜不显示
    if (fromGame){
      rankSummary.innerHTML = '<div class="rs-emoji">' + (ANIMALS[maxLevel - 1] || '🐾') + '</div>' +
        '<div class="rs-level">合到 <b>' + maxLevel + '</b> 级</div>';
      rankSummary.style.display = 'block';
    } else {
      rankSummary.style.display = 'none';
    }
    try {
      const { list, mine, total } = await fetchBoardList();
      rankLoading.style.display = 'none';
      if (list.length === 0){
        rankList.style.display = 'block';
        rankList.innerHTML = '<div class="rank-empty">还没有成绩，快来第一个上榜 🛁</div>';
      } else {
        rankList.style.display = 'block';
        rankList.innerHTML = list.map((row, i) =>
          '<div class="rank-row' + (row.nickname === nickname ? ' me' : '') + '"><span class="rank-no">' + (i < 3 ? '👑' : '') + (i + 1) + '</span><span class="rank-name">' + escapeHtml(row.nickname) + '</span><span class="rank-score">' + row.score.toLocaleString() + '</span><span class="rank-max">' + (row.maxLevel || 1) + '</span></div>'
        ).join('');
      }
      if (mine){
        rankMine.style.display = 'block';
        if (afterGameRank){
          const beat = Math.max(0, total - mine.rank);
          rankMine.textContent = '本局 ' + score.toLocaleString() + ' 分 · 第 ' + mine.rank + ' 名 · 超越 ' + beat + ' 人';
        } else {
          rankMine.textContent = '我的排名：第 ' + mine.rank + ' 名 · ' + mine.score.toLocaleString() + ' 分';
        }
      } else if (afterGameRank){
        // 提交失败/未上榜：结算也要给个交代
        rankMine.style.display = 'block';
        rankMine.textContent = '本局 ' + score.toLocaleString() + ' 分 · 未上榜（提交失败？）';
      }
    } catch (e){
      rankLoading.style.display = 'none';
      rankList.style.display = 'block';
      rankList.innerHTML = '<div class="rank-empty">排行榜加载失败（网络问题？）</div>';
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // ===== 昵称 =====
  function showNameOverlay(){
    nameInput.value = nickname || '';
    // v4.9.5: 设备已有昵称 → 输入框锁定禁改（同一设备一个 ID）
    const locked = !!nickname;
    nameInput.disabled = locked;
    document.getElementById('lockTip').style.display = locked ? 'block' : 'none';
    const hasLocal = loadLocalSave() !== null;
    if (hasLocal){
      nameContinue.style.display = 'block';
    } else {
      nameContinue.style.display = 'none';
      checkCloudSave().then(state => {
        if (state && nameOverlay.classList.contains('show')) nameContinue.style.display = 'block';
      });
    }
    nameOverlay.classList.add('show');
    // iOS 首帧 flex 高度可能尚未落定；遮罩显示后等两帧再收窄背景棋盘。
    requestAnimationFrame(() => requestAnimationFrame(fitBoard));
    setTimeout(() => { try { nameInput.focus(); } catch (e) {} }, 150);
  }

  function hideNameOverlay(){ nameOverlay.classList.remove('show'); }

  let nameBusy = false;   // 查重进行中防连点重复提交

  // v5.7: 软查重——scores+saves 两表忽略大小写查，重复则弹窗让用户自决（本人确认继续/非本人换名），不再硬拦截
  // 查询失败（断网等）放行：不因为后端问题把玩家挡在门外
  // v5.8: 两次查询改并行（Promise.all），省一半等待
  async function isNameTaken(name){
    try {
      // ilike 值不加引号——PostgREST 对引号包裹的 percent-encoded 中文匹配失败（v4.9.6 实测）
      const enc = encodeURIComponent(name);
      const [r1, r2] = await Promise.all([
        sbFetch('scores?select=nickname&nickname=ilike.' + enc + '&limit=1'),
        sbFetch('saves?select=nickname&nickname=ilike.' + enc + '&limit=1')
      ]);
      const a = await r1.json();
      const b = await r2.json();
      return (Array.isArray(a) && a.length) || (Array.isArray(b) && b.length);
    } catch (e) { return false; }
  }

  // v5.8: 进游戏后后台查重——不堵门口（先进先玩），撞名再弹窗提醒（软提醒本质：提醒不拦截）
  async function checkDupAsync(name){
    nameBusy = true;
    try {
      const taken = await isNameTaken(name);
      if (taken) showDupOverlay(name);
    } catch (e) {} finally {
      nameBusy = false;
    }
  }

  function showDupOverlay(name){
    dupOverlay.classList.add('show');

  function enterGame(name){
    nickname = name;
    try { localStorage.setItem(NICK_KEY, nickname); } catch (e) {}
    whoNameEl.textContent = nickname;
    trackEvent('login', { action: 'new' });   // v5.5: 输入昵称即记（进来的玩家，不等结算上榜）
    startNewGame();
